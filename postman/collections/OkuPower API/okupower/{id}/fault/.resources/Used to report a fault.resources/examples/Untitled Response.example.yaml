$kind: http-example
request:
  url: "{{baseUrl}}/okupower/:id/fault/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "1002",
        "message": "The content of the request body contains errors, kindly fix"
      }
order: 1000
