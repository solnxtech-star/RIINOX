$kind: http-request
description: |-
  Takes a set of user credentials and returns an access and refresh JSON web
  token pair to prove the authentication of those credentials.
url: "{{baseUrl}}/api/auth/jwt/create/"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
body:
  type: urlencoded
  content:
    - key: email
      value: <string>
      description: "(Required) "
    - key: password
      value: <string>
      description: "(Required) "
    - key: account_type
      value: STAFF
      description: |-
        * `CONSUMER` - CONSUMER
        * `DISCO` - DISCO
        * `STAFF` - STAFF
settings: {}
examples: ./.resources/api auth jwt create create.resources/examples
order: 1000
