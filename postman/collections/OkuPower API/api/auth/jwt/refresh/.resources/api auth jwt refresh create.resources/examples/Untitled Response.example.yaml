$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/jwt/refresh/"
  method: POST
  headers:
    Content-Type: application/x-www-form-urlencoded
    Accept: application/json
  body:
    type: urlencoded
    content:
      - key: access
        value: <string>
        description: "(Required) "
      - key: refresh
        value: <string>
        description: "(Required) "
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "access": "<string>",
        "refresh": "<string>"
      }
order: 1000
