$kind: http-request
url: "{{baseUrl}}/api/v1/users/reset_password_confirm/"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
body:
  type: urlencoded
  content:
    - key: email
      value: <email>
      description: "(Required) "
    - key: new_password
      value: <string>
      description: "(Required) "
    - key: re_new_password
      value: <string>
      description: "(Required) "
    - key: token
      value: <string>
      description: "(Required) "
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api v1 users reset password confirm create.resources/examples
order: 1000
