$kind: http-request
url: "{{baseUrl}}/api/v1/users/:id/"
method: PATCH
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
pathVariables:
  - key: id
    value: <string>
    description: (Required) A unique value identifying this user.
body:
  type: urlencoded
  content:
    name: <string>
    url: <uri>
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api v1 users partial update.resources/examples
order: 3000
