$kind: http-request
url: "{{baseUrl}}/api/v1/users/:id/"
method: DELETE
pathVariables:
  - key: id
    value: <string>
    description: (Required) A unique value identifying this user.
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api v1 users destroy.resources/examples
order: 4000
