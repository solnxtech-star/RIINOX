$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/users/:id/"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
  body:
    type: urlencoded
    content:
      name: <string>
      url: <uri>
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "url": "<uri>",
        "name": "<string>"
      }
order: 1000
