$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/users/logout/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "url": "<uri>",
        "name": "<string>"
      }
order: 1000
