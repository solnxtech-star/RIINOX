  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "account": {
          "id": "<string>",
          "is_consumer": "<boolean>",
          "is_disco": "<boolean>",
          "is_staff": "<boolean>",
          "position": "<string>",
          "type": "CONSUMER"
        },
        "email": "<email>",
        "id": "<string>",
        "setup_info": "<string>",
        "is_staff": "<boolean>",
        "is_active": "<boolean>",
        "user_permissions": [
          "<integer>",
          "<integer>"
        ],
        "groups": [
          "<integer>",
          "<integer>"
        ],
        "name": "<string>",
        "phone_no": "<string>",
        "has_activated_2fa": "<boolean>"
      }
order: 1000
