$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/users/me/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
