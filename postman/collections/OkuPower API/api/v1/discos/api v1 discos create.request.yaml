$kind: http-request
url: "{{baseUrl}}/api/v1/discos/"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
body:
  type: urlencoded
  content:
    logo: <uri>
    address: <string>
    phone_no: <string>
    cac_registration_no: <string>
    cac_registration_doc: <uri>
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api v1 discos create.resources/examples
order: 7000
