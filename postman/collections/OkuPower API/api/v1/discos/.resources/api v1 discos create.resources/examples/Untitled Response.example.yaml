$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/discos/"
  method: POST
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: urlencoded
    content:
      logo: <uri>
      address: <string>
      phone_no: <string>
      cac_registration_no: <string>
      cac_registration_doc: <uri>
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "logo": "<uri>",
        "address": "<string>",
        "phone_no": "<string>",
        "cac_registration_no": "<string>",
        "cac_registration_doc": "<uri>"
      }
order: 1000
