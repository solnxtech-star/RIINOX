$kind: http-request
url: "{{baseUrl}}/api/v1/discos/?cac_registration_no=<string>&ordering=<string>&page=<integer>&search=<string>&tick=<string>&user__name=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: cac_registration_no
    value: <string>
  - key: ordering
    value: <string>
    description: Which field to use when ordering the results.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: search
    value: <string>
    description: A search term.
  - key: tick
    value: <string>
  - key: user__name
    value: <string>
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api v1 discos list.resources/examples
order: 6000
