$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/payments/:id/verify_payment/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": {
          "message": "Payment verified successfully",
          "status": "success"
        }
      }
order: 1000
