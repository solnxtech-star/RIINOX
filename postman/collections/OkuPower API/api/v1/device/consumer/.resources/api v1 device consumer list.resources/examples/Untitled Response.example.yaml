$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/device/consumer/?batch_no=<string>&disco__user__name=<string>&ordering=<string>&page=<integer>&search=<string>&status=DISCONNECTED&type=ONE_PHASE&user__name=<string>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: batch_no
      value: <string>
    - key: disco__user__name
      value: <string>
    - key: ordering
      value: <string>
      description: Which field to use when ordering the results.
    - key: page
      value: <integer>
      description: A page number within the paginated result set.
    - key: search
      value: <string>
      description: A search term.
    - key: status
      value: DISCONNECTED
      description: |-
        * `CONNECTED` - CONNECTED
        * `ASSIGNED` - ASSIGNED
        * `DISCONNECTED` - DISCONNECTED
        * `BREACHED` - BREACHED
        * `DEFAULT` - DEFAULT
    - key: type
      value: ONE_PHASE
      description: |-
        * `ONE_PHASE` - ONE_PHASE
        * `THREE_PHASE` - THREE_PHASE
    - key: user__name
      value: <string>
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "count": "<integer>",
        "next": "<uri>",
        "previous": "<uri>",
        "results": [
          {
            "band_name": "<string>",
            "branch_name": "<string>",
            "consumption": "<integer>",
            "id": "<string>",
            "on_bonus": "<string>",
            "time_left": "<integer>",
            "user_address": "<string>",
            "user_email": "<string>",
            "user_name": "<string>",
            "user_phone_no": "<string>",
            "meter_no": "<string>",
            "status": "CONNECTED",
            "type": "THREE_PHASE"
          },
          {
            "band_name": "<string>",
            "branch_name": "<string>",
            "consumption": "<integer>",
            "id": "<string>",
            "on_bonus": "<string>",
            "time_left": "<integer>",
            "user_address": "<string>",
            "user_email": "<string>",
            "user_name": "<string>",
            "user_phone_no": "<string>",
            "meter_no": "<string>",
            "status": "CONNECTED",
            "type": "ONE_PHASE"
          }
        ]
      }
order: 1000
