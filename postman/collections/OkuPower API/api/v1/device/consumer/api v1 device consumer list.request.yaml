$kind: http-request
description: This viewset handles consumer related actions on devices
url: "{{baseUrl}}/api/v1/device/consumer/?batch_no=<string>&disco__user__name=<string>&ordering=<string>&page=<integer>&search=<string>&status=DISCONNECTED&type=ONE_PHASE&user__name=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: batch_no
    value: <string>
  - key: disco__user__name
    value: <string>
  - key: ordering
    value: <string>
    description: Which field to use when ordering the results.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: search
    value: <string>
    description: A search term.
  - key: status
    value: DISCONNECTED
    description: |-
      * `CONNECTED` - CONNECTED
      * `ASSIGNED` - ASSIGNED
      * `DISCONNECTED` - DISCONNECTED
      * `BREACHED` - BREACHED
      * `DEFAULT` - DEFAULT
  - key: type
    value: ONE_PHASE
    description: |-
      * `ONE_PHASE` - ONE_PHASE
      * `THREE_PHASE` - THREE_PHASE
  - key: user__name
    value: <string>
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api v1 device consumer list.resources/examples
order: 3000
