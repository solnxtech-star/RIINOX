$kind: http-request
url: "{{baseUrl}}/api/v1/bands/?created_by__user__name=<string>&devices__id=<string>&devices__user__name=<string>&name=<string>&ordering=<string>&page=<integer>&search=<string>&tariff=<number>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: created_by__user__name
    value: <string>
  - key: devices__id
    value: <string>
  - key: devices__user__name
    value: <string>
  - key: name
    value: <string>
  - key: ordering
    value: <string>
    description: Which field to use when ordering the results.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: search
    value: <string>
    description: A search term.
  - key: tariff
    value: <number>
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api v1 bands list.resources/examples
order: 3000
