$kind: http-request
description: |-
  Rename a particular band in a branch
  Rename a particular band in a branch
url: "{{baseUrl}}/api/v1/bands/:id/rename/"
method: PATCH
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
pathVariables:
  - key: id
    value: <string>
    description: (Required) A unique value identifying this band.
body:
  type: urlencoded
  content:
    name: <string>
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Rename a particular band.resources/examples
order: 1000
