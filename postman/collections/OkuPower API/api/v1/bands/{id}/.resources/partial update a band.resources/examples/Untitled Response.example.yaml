$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/bands/:id/"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
  body:
    type: urlencoded
    content:
      tariff: "6183544383272221924427738296554795026468653672247651288489307402960839301134750325658599.45"
      name: <string>
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "tariff": "36667061824946529."
      }
order: 1000
