$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/bands/:id/"
  method: PUT
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
  body:
    type: urlencoded
    content:
      - key: name
        value: <string>
        description: "(Required) "
      - key: tariff
        value: "36667061824946529."
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "tariff": "36667061824946529."
      }
order: 1000
