$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/bands/"
  method: POST
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: urlencoded
    content:
      - key: name
        value: <string>
        description: "(Required) "
      - key: tariff
        value: "328319134421465041450488133"
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "tariff": "328319134421465041450488133"
      }
order: 1000
