$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/disco/payments/:id/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "created_at": "<dateTime>",
        "device_id": "<string>",
        "id": "<string>",
        "meter_no": "<string>",
        "name": "<string>",
        "amount": "<double>",
        "status": "ongoing",
        "channel": "CREDIT_CARD"
      }
order: 1000
