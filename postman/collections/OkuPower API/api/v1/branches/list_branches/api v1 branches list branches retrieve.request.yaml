$kind: http-request
description: List all branches without pagination
url: "{{baseUrl}}/api/v1/branches/list_branches/"
method: GET
headers:
  Accept: application/json
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api v1 branches list branches retrieve.resources/examples
order: 1000
