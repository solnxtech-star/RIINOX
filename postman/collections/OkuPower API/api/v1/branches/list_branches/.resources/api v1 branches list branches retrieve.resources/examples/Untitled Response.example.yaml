$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/branches/list_branches/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "address": "<string>",
        "id": "<string>",
        "name": "<string>",
        "staffs": [
          "<string>",
          "<string>"
        ],
        "devices": [
          "<string>",
          "<string>"
        ],
        "phone_no": "<string>",
        "email": "<email>",
        "default": "<boolean>",
        "location": {
          "type": "Point",
          "coordinates": [
            "<float>",
            "<float>"
          ]
        }
      }
order: 1000
