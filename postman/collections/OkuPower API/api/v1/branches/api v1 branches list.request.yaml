$kind: http-request
url: "{{baseUrl}}/api/v1/branches/?devices__id=<string>&devices__user__name=<string>&email=<string>&name=<string>&ordering=<string>&page=<integer>&phone_no=<string>&search=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: devices__id
    value: <string>
  - key: devices__user__name
    value: <string>
  - key: email
    value: <string>
  - key: name
    value: <string>
  - key: ordering
    value: <string>
    description: Which field to use when ordering the results.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: phone_no
    value: <string>
  - key: search
    value: <string>
    description: A search term.
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api v1 branches list.resources/examples
order: 3000
