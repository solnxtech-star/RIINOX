$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/manage/devices/assign/"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: urlencoded
    content:
      - key: to_band
        value: <string>
      - key: devices
        value: <string>
      - key: devices
        value: <string>
      - key: to_branch
        value: <string>
      - key: address
        value: <string>
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": "<string>"
      }
order: 1000
