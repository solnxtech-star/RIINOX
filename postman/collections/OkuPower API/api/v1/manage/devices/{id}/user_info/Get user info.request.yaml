$kind: http-request
description: Get user's information.
url: "{{baseUrl}}/api/v1/manage/devices/:id/user_info/"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <string>
    description: (Required) A unique value identifying this device.
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Get user info.resources/examples
order: 1000
