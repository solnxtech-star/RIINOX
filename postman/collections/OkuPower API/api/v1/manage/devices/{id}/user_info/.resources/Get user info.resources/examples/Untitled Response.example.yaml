$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/manage/devices/:id/user_info/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "<string>",
        "user_address": "<string>",
        "user_email": "<string>",
        "user_name": "<string>",
        "user_phone_no": "<string>"
      }
order: 1000
