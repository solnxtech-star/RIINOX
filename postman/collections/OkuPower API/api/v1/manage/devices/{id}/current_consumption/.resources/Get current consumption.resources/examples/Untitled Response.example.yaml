$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/manage/devices/:id/current_consumption/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "created_at": "<dateTime>",
        "id": "<string>",
        "device": "<string>",
        "frequency": "<integer>",
        "voltage": "<integer>",
        "current": "<integer>",
        "time_left": "<string>",
        "load": "<double>"
      }
order: 1000
