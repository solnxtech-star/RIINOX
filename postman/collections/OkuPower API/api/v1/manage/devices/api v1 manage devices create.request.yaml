$kind: http-request
description: This viewset handles Disco related actions on devices
url: "{{baseUrl}}/api/v1/manage/devices/"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
body:
  type: urlencoded
  content:
    - key: batch_no
      value: <string>
      description: "(Required) "
    - key: id
      value: <string>
      description: "(Required) "
    - key: type
      value: THREE_PHASE
      description: |-
        (Required) * `ONE_PHASE` - ONE_PHASE
        * `THREE_PHASE` - THREE_PHASE
    - key: meter_no
      value: <string>
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api v1 manage devices create.resources/examples
order: 7000
