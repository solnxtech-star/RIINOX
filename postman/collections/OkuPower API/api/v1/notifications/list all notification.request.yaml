$kind: http-request
description: Retrieve a list of all notification for this user.
url: "{{baseUrl}}/api/v1/notifications/?ordering=<string>&page=<integer>&search=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: ordering
    value: <string>
    description: Which field to use when ordering the results.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: search
    value: <string>
    description: A search term.
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/list all notification.resources/examples
order: 2000
