$kind: http-request
description: Retrieve an instance of the notification.
url: "{{baseUrl}}/api/v1/notifications/:id/"
method: GET
pathVariables:
  - key: id
    value: <string>
    description: (Required) A unique value identifying this Notification.
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/retrieve notification.resources/examples
order: 1000
