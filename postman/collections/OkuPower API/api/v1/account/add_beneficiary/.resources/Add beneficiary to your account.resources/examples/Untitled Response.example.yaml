$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/account/add_beneficiary/"
  method: POST
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: urlencoded
    content:
      - key: meter_no
        value: <string>
        description: "(Required) "
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": "<string>"
      }
order: 1000
