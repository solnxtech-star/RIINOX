$kind: http-request
description: My info
url: "{{baseUrl}}/api/v1/account/:id/?page=<integer>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
pathVariables:
  - key: id
    value: <string>
    description: (Required) A unique value identifying this account.
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/list beneficiaries attached to your account.resources/examples
order: 1000
