$kind: http-request
url: "{{baseUrl}}/api/v1/account/verify_beneficiary/"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
body:
  type: urlencoded
  content:
    - key: meter_no
      value: <string>
      description: "(Required) "
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Verify beneficiary.resources/examples
order: 1000
