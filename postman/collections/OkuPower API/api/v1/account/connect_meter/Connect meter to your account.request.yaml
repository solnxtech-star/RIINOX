$kind: http-request
description: |-
  Note: account and device query parameters are not needed here.
  Flow:
      1. Checks if the user has any existing account
      2. Checks if any of the account was made for the disco of the device passed in the body
      3. If no account exist for the user a new account is created
          otherwise an account is created for the user
      4. Either ways the device is attached to the user and if the users chooses to move
          their former credit(If they have any) the credit would be moved to this new device
url: "{{baseUrl}}/api/v1/account/connect_meter/"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
body:
  type: urlencoded
  content:
    - key: meter_no
      value: <string>
      description: "(Required) "
    - key: move_former_credit
      value: "false"
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Connect meter to your account.resources/examples
order: 1000
