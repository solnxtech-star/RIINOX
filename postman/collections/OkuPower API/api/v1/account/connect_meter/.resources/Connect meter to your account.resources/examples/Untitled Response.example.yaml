$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/account/connect_meter/"
  method: POST
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: urlencoded
    content:
      - key: meter_no
        value: <string>
        description: "(Required) "
      - key: move_former_credit
        value: "false"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": "<string>"
      }
order: 1000
