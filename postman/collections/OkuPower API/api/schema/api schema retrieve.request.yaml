$kind: http-request
description: |-
  OpenApi3 schema for this API. Format can be selected via content negotiation.

  - YAML: application/vnd.oai.openapi
  - JSON: application/vnd.oai.openapi+json
url: "{{baseUrl}}/api/schema/?format=yaml&lang=uz"
method: GET
headers:
  Accept: application/vnd.oai.openapi
queryParams:
  format: yaml
  lang: uz
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api schema retrieve.resources/examples
order: 1000
