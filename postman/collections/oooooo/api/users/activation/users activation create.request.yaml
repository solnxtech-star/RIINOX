$kind: http-request
url: "{{baseUrl}}/api/users/activation/"
method: POST
headers:
  Content-Type: multipart/form-data
  Accept: application/json
body:
  type: formdata
  content:
    - type: text
      key: email
      value: <email>
      description: "(Required) "
    - type: text
      key: token
      value: <string>
      description: "(Required) "
auth:
  type: apikey
  credentials:
    key: __Secure-sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/users activation create.resources/examples
order: 1000
