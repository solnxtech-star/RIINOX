$kind: http-request
description: Get a list of all pollutants.
url: "{{baseUrl}}/api/pollutant/?ordering=<string>&page=<integer>&search=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: ordering
    value: <string>
    description: Which field to use when ordering the results.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: search
    value: <string>
    description: A search term.
settings: {}
examples: ./.resources/pollutant list.resources/examples
order: 2000
