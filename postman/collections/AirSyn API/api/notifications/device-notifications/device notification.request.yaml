$kind: http-request
description: List notifications related to device state or status changes.
url: "{{baseUrl}}/api/notifications/device-notifications/"
method: GET
headers:
  Accept: application/json
auth:
  type: apikey
  credentials:
    key: __Secure-sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/device notification.resources/examples
order: 1000
