$kind: http-example
request:
  url: "{{baseUrl}}/api/users/me/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: __Secure-sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "<email>",
        "id": "<integer>",
        "has_activated_2fa": "<boolean>"
      }
order: 1000
