$kind: http-example
name: Untitled Response
request:
  url: "{{baseUrl}}/api/devices/"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: __Secure-sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "slug": "<string>",
        "status": "SAFE",
        "name": "<string>",
        "location": "<string>",
        "state": "OFF",
        "specification": "<integer>"
      }
response:
  statusCode: 405
  statusText: Method Not Allowed
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": "<string>"
      }
order: 8000
