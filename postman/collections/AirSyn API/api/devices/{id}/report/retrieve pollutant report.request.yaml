$kind: http-request
description: Retrieve pollutant reports for a specific device within a given date range and interval.
url: "{{baseUrl}}/api/devices/:id/report/"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <string>
    description: (Required) A unique value identifying this Device.
auth:
  type: apikey
  credentials:
    key: __Secure-sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/retrieve pollutant report.resources/examples
order: 1000
