$kind: http-example
name: Untitled Response
request:
  url: "{{baseUrl}}/api/devices/:id/"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: __Secure-sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "status": "UNSAFE",
        "name": "<string>",
        "location": "<string>",
        "state": "ON"
      }
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": "<string>"
      }
order: 10000
