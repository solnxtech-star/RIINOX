$kind: http-request
description: ViewSet for managing pollutant snapshots
url: "{{baseUrl}}/api/pollutant_snapshot/:id/"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <string>
    description: (Required) A unique value identifying this PollutantSnapShot.
body:
  type: json
  content: |-
    {
      "device": "<string>",
      "pollutant": "<string>",
      "value": "<double>",
      "id": 6886448.988080621,
      "pollutant_state": true
    }
settings: {}
examples: ./.resources/pollutant snapshot update.resources/examples
order: 2000
