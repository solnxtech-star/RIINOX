$kind: http-example
request:
  url: "{{baseUrl}}/api/users/reset_password_confirm/"
  method: POST
  headers:
    - key: Content-Type
      value: multipart/form-data
    - key: Accept
      value: application/json
    - key: __Secure-sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: formdata
    content:
      - type: text
        key: email
        value: <email>
        description: "(Required) "
      - type: text
        key: new_password
        value: <string>
        description: "(Required) "
      - type: text
        key: re_new_password
        value: <string>
        description: "(Required) "
      - type: text
        key: token
        value: <string>
        description: "(Required) "
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "<email>",
        "new_password": "<string>",
        "re_new_password": "<string>",
        "token": "<string>"
      }
order: 1000
