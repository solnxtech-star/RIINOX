$kind: http-request
url: "{{baseUrl}}/api/users/:id/"
method: PATCH
headers:
  Content-Type: multipart/form-data
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this user.
body:
  type: formdata
  content: []
auth:
  type: apikey
  credentials:
    key: __Secure-sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/users partial update.resources/examples
order: 3000
