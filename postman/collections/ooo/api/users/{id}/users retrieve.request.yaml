$kind: http-request
url: "{{baseUrl}}/api/users/:id/"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this user.
auth:
  type: apikey
  credentials:
    key: __Secure-sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/users retrieve.resources/examples
order: 1000
