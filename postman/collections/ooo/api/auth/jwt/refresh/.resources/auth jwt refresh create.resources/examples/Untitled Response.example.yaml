$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/jwt/refresh/"
  method: POST
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
  body:
    type: formdata
    content:
      - type: text
        key: refresh
        value: <string>
        description: "(Required) "
      - type: text
        key: access
        value: "false"
        description: "(Required) "
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "access": "<string>",
        "refresh": true
      }
order: 1000
