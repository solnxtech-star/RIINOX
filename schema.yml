          nullable: true
          description: Required explanation when the request is rejected.
        product:
          type: string
          description: Product the adjustment applies to.
        variant:
          type: string
          nullable: true
          description: Variant the adjustment applies to, if applicable.
        batch:
          type: string
          nullable: true
          description: Batch the adjustment applies to, if applicable.
        warehouse:
          type: string
          description: Warehouse the adjustment applies to.
        requested_by:
          type: integer
          readOnly: true
          nullable: true
          description: User who raised this request.
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
          description: Admin/Owner who approved or rejected this request.
      required:
      - created_at
      - id
      - product
      - rejection_reason
      - requested_by
      - requested_quantity_change
      - reviewed_at
      - reviewed_by
      - status
      - updated_at
      - warehouse
    StockAdjustmentRequestStatusEnum:
      enum:
      - not_required
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `not_required` - Not Required
        * `pending` - Pending Approval
        * `approved` - Approved
        * `rejected` - Rejected
    StockTransfer:
      type: object
      properties:
        product_id:
          type: string
        variant_id:
          type: string
          nullable: true
        batch_id:
          type: string
          nullable: true
        source_warehouse_id:
          type: string
        destination_warehouse_id:
          type: string
        quantity:
          type: integer
          minimum: 1
      required:
      - destination_warehouse_id
      - product_id
      - quantity
      - source_warehouse_id
    TaxConfigEnum:
      enum:
      - taxable
      - non_taxable
      - exempt
      type: string
      description: |-
        * `taxable` - Taxable
        * `non_taxable` - Non-Taxable
        * `exempt` - Exempt
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    UnitNameEnum:
      enum:
      - pcs
      - kg
      - g
      - l
      - ml
      - box
      - pack
      - carton
      - dozen
      - m
      - other
      type: string
      description: |-
        * `pcs` - Piece(s)
        * `kg` - Kilogram
        * `g` - Gram
        * `l` - Litre
        * `ml` - Millilitre
        * `box` - Box
        * `pack` - Pack
        * `carton` - Carton
        * `dozen` - Dozen
        * `m` - Metre
        * `other` - Other
    UsernameResetConfirm:
      type: object
      properties:
        new_email:
          type: string
          format: email
          title: Email
      required:
      - new_email
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
