            Unit stock quantities for this product are counted in.

            * `pcs` - Piece(s)
            * `kg` - Kilogram
            * `g` - Gram
            * `l` - Litre
            * `ml` - Millilitre
            * `box` - Box
            * `pack` - Pack
            * `carton` - Carton
            * `dozen` - Dozen
            * `m` - Metre
            * `other` - Other
