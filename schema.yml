  /api/organizations/{organization_id}/purchases/{id}/receive/:
    post:
      operationId: organizations_purchases_receive_create
      description: |-
        ### Overview
        Records the physical arrival and check-in of ordered goods at the target warehouse (PRD §16, §18, §42).

        ### Required Permissions & Access Control (PRD §28, §55)
        - Requires **`RECEIVE_GOODS`** permission in the target tenant organization.
        - Non-receiving roles (e.g. Sales Representative or roles with only `VIEW_PURCHASES`) are rejected with HTTP 403 Forbidden.

        ### Plan Limits & Subscription Invariants (PRD §10, §52)
        - **Active Subscription**: Calls `ensure_subscription_active(purchase.organization)`. Inactive or delinquent subscriptions immediately reject goods receipt with HTTP 402/403.
        - **Monthly Transactions Limit**: Receiving goods generates a centralized system `Transaction` (type `PURCHASE`, status `COMPLETED`), enforcing `check_plan_limit(organization, 'max_transactions_per_month', cycle_count)`. If the monthly limit is exceeded, receipt is blocked with HTTP 402/403 (`PLAN_LIMIT_EXCEEDED`).

        ### Atomic Operations & Ledger Integration (PRD §16, §18, §31, §42)
        When this endpoint is called, the following steps execute inside a single `@transaction.atomic` block:
        1. **Subscription & Quota Validation**: Verifies active subscription standing (`ensure_subscription_active`) and monthly transaction quotas.
        2. **Line Item Validation**: Verifies that each `item_id` belongs to this order and that `quantity_received` is valid.
        3. **Transaction Creation**: Creates a centralized `Transaction` record (type `PURCHASE`, status `COMPLETED`).
        4. **Inventory Stock Increment**: Increases physical stock in `Inventory.quantity` for the product/variant in the destination warehouse.
        5. **Ledger Recording**: Creates an immutable `InventoryLedgerEntry` documenting positive `quantity_moved`, snapshotted `unit_cost`, `warehouse`, and reference transaction.
        6. **PO Status Transition**:
           - If all items have reached their ordered quantity -> Status becomes `received`.
           - If partial quantities have been received -> Status becomes `partially_received`.
        7. **Audit Event**: Logs `AuditAction.PURCHASE_ORDER_RECEIVED` recording the receiver and quantity change.

        ### Critical Edge Cases Handled (PRD §18)
        - **Cancelled Orders**: Cannot receive goods against a `cancelled` purchase order (HTTP 400: `Cannot receive goods against a cancelled purchase order`).
        - **Over-Receiving Guard**: Cannot receive more units than `quantity_ordered - quantity_received` (HTTP 400: `Cannot receive X units. Already received Y of Z ordered`).
        - **Non-Positive Quantities**: `quantity_received` must be `>= 1` (HTTP 400: `Received quantity must be greater than zero`).
        - **Invalid Item UUID**: Each `item_id` must match a valid `PurchaseItem` belonging to this specific order.
        - **Receiver Accountability**: Records the authenticated user as `received_by` for strict operational attribution.
      summary: Receive Goods (Stock Check-In)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A UUID string identifying this Purchase.
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{32,36}$
        required: true
      tags:
      - Purchases
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseReceive'
            examples:
              PartialOrFullGoodsReceipt:
                value:
                  items_received:
                  - item_id: 8c2deb4d-4c8d-5cae-acde-3c1e8c4dcb7e
                    quantity_received: 50
                summary: Receive items payload
                description: Records physical arrival of goods for one or more purchase
                  line items. Every received item immediately generates an InventoryLedgerEntry
                  and increases warehouse stock.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PurchaseReceive'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PurchaseReceive'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReceiveResponse'
              examples:
                GoodsReceiptSuccess:
                  value:
                    status: received
                    purchase_status: partially_received
                    items_received_count: 1
                  summary: Receipt confirmation
                  description: Result of goods receipt, including updated lifecycle
                    status and count of lines processed.
          description: Goods successfully checked in, stock updated, and ledger entry
            created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseCodeDetailError'
              examples:
                Over-ReceivingRejected:
                  value:
                    code: RECEIVE_ERROR
                    detail: Cannot receive 150 units of 'Widget A'. Already received
                      0 of 100 ordered.
                  summary: Over-Receiving Rejected
                CancelledOrderRejected:
                  value:
                    code: RECEIVE_ERROR
                    detail: Cannot receive goods against a cancelled purchase order.
                  summary: Cancelled Order Rejected
                Non-PositiveQuantityRejected:
                  value:
                    code: RECEIVE_ERROR
                    detail: Received quantity must be greater than zero for 'Widget
                      A'.
                  summary: Non-Positive Quantity Rejected
          description: Goods receipt validation failure.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseDetailError'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
          description: Authentication credentials were not provided or are invalid.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseCodeDetailError'
              examples:
                MonthlyTransactionLimitReached:
                  value:
                    code: PLAN_LIMIT_EXCEEDED
                    detail: Plan limit reached for 'max_transactions_per_month'. Upgrade
                      your subscription to continue processing goods receipts.
                  summary: Monthly Transaction Limit Reached
                SubscriptionInactive:
                  value:
                    code: SUBSCRIPTION_INACTIVE
                    detail: Organization subscription is expired or inactive.
                  summary: Subscription Inactive
          description: The organization's subscription is inactive or has exceeded
            plan limits (e.g. max_transactions_per_month).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseDetailError'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: The caller lacks permission to perform this action (e.g. lacking
            VIEW_PURCHASES, CREATE_PURCHASE, or RECEIVE_GOODS).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseDetailError'
              examples:
                NotFound:
                  value:
                    detail: No Purchase matches the given query.
          description: The requested purchase order was not found, or belongs to an
            organization the caller is not a member of.
  /api/organizations/{organization_id}/sales/:
