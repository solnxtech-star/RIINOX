  /api/organizations/{organization_id}/sales/{id}/cancel/:
    post:
      operationId: organizations_sales_cancel_create
      description: |-
        ### Overview
        Cancels an existing sale order per PRD §44 (Cancellations & Immutability).

        ### Business Workflow
        - Validates active organization subscription.
        - Verifies the sale is not already cancelled.
        - Reverses all deducted stock movements back to warehouse inventory.
        - Records compensating ledger entries (`InventoryLedgerEntry`).
        - Updates `cancelled_at`, `cancelled_by`, `cancel_reason`, and sets `fulfillment_status = CANCELED`.
        - Records centralized audit log event (`sales_order.cancelled`).
      summary: Cancel Sale Order
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A UUID string identifying this Sale.
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{32,36}$
        required: true
      tags:
      - Sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCancel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaleCancel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaleCancel'
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
          description: Sale cancelled successfully and stock reversed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesDetailError'
          description: Sale cannot be cancelled (already cancelled or has returns).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesDetailError'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
          description: Authentication credentials were not provided or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesDetailError'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: The caller lacks permission to perform this action (e.g. lacking
            VIEW_SALES, CREATE_SALE, CREATE_SALE_RETURN, or APPLY_DISCOUNT).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesDetailError'
              examples:
                NotFound:
                  value:
                    detail: Not found.
          description: The requested sale or return record was not found, or belongs
            to another organization.
  /api/organizations/{organization_id}/sales/returns/:
    get:
      operationId: organizations_sales_returns_list
      description: |-
        ### Overview
        Retrieves a paginated list of all sale returns for organizations the authenticated user belongs to. Implements strict multi-tenant boundary isolation (PRD §6).

        ### Required Permissions & Access Control (PRD §28, §55)
        - Requires **`VIEW_SALES`** permission in the target tenant organization.
        - Unauthenticated callers receive HTTP 401; unauthorized callers receive HTTP 403 Forbidden.

        ### Plan Limits & Subscription Invariants (PRD §10, §52)
        - Read operations do NOT consume monthly transaction allowances (`max_transactions_per_month`).
      summary: List Sale Returns
      parameters:
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: max_refund
        schema:
          type: number
      - in: query
        name: min_refund
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: organization
        schema:
          type: string
        description: Filter sale returns belonging to a specific organization UUID.
      - in: path
        name: organization_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{32,36}$
        required: true
      - in: query
        name: original_sale
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: refund_method
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - Sales
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSaleReturnList'
          description: Successful retrieval of returns list.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesDetailError'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
          description: Authentication credentials were not provided or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesDetailError'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: The caller lacks permission to perform this action (e.g. lacking
            VIEW_SALES, CREATE_SALE, CREATE_SALE_RETURN, or APPLY_DISCOUNT).
    post:
      operationId: organizations_sales_returns_create
      description: |-
        ### Overview
        Creates a new customer return against an original sale, specifying items returned, refund amounts, item conditions, and restock actions (PRD §16, §26).

        ### Required Permissions & Access Control (PRD §28, §55)
        - Requires **`CREATE_SALE_RETURN`** permission in the target organization.
        - Roles without return authorization (e.g. standard Sales Representatives) receive HTTP 403 Forbidden.
        - If `organization` is omitted from the request body, tenant scope is automatically resolved from `original_sale.organization`.

        ### Plan Limits & Subscription Invariants (PRD §10, §52)
        - **Active Subscription**: Calls `ensure_subscription_active(organization)`. Inactive subscriptions reject return creation.
        - **Monthly Transactions Quota**: Creates a centralized system `Transaction` (type `RETURN`, status `COMPLETED`), consuming transaction allowance via `consume_usage(organization, UsageMetric.TRANSACTIONS)`. Exceeding limits returns HTTP 403 (`PLAN_LIMIT_REACHED`).

        ### Inventory & Ledger Invariants (PRD §16, §26)
        When processed atomically via `process_return_inventory_and_ledger`:
        1. **Restocking Action (`restock_action`)**:
           - `return_to_stock`: Adds returned stock back into the warehouse generic pool (`batch=None`), increases `Inventory.quantity`, and creates a positive `InventoryLedgerEntry` (`quantity_moved = +returned_qty`).
           - `damage`: Does not return stock to sellable inventory; preserves defective status for damage write-off.
        2. **Audit Attribution**: Records audit logs linking the return to the original sale and sales rep.
      summary: Create Sale Return (Restock & Refund)
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{32,36}$
        required: true
      tags:
      - Sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleReturnCreate'
            examples:
              SaleReturnRequest:
                value:
                  original_sale: e4f5a6b7-c8d9-4789-b1c2-d3e4f5a6b7cb
                  organization: a1b2c3d4-e5f6-4789-b1c2-d3e4f5a6b7c8
                  return_reason: DEFECTIVE
                  refund_amount: '4837.50'
                  items:
                  - sale_item: f5a6b7c8-d9e0-4789-b1c2-d3e4f5a6b7cc
                    quantity: 1
                    refund_amount: '4837.50'
                    condition: defective
                summary: Process customer return with restock or damage action
                description: Registers returned goods against an existing sale. If
                  restock_action is return_to_stock, restocks inventory and writes
                  ledger entries.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaleReturnCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaleReturnCreate'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleReturn'
              examples:
                SaleReturnResponse:
                  value:
                    id: a7b8c9d0-e1f2-4789-b1c2-d3e4f5a6b7cd
                    original_sale: e4f5a6b7-c8d9-4789-b1c2-d3e4f5a6b7cb
                    organization: a1b2c3d4-e5f6-4789-b1c2-d3e4f5a6b7c8
                    return_reason: DEFECTIVE
                    refund_amount: '4837.50'
                    refund_method: original_payment
                    status: completed
                    items:
                    - id: b8c9d0e1-f2a3-4789-b1c2-d3e4f5a6b7ce
                      sale_return: a7b8c9d0-e1f2-4789-b1c2-d3e4f5a6b7cd
                      sale_item: f5a6b7c8-d9e0-4789-b1c2-d3e4f5a6b7cc
                      quantity: 1
                      refund_amount: '4837.50'
                      condition: defective
                      restock_action: return_to_stock
                  summary: Confirmed return record
                  description: Full representation of processed return including status
                    and returned items.
          description: Sale return processed successfully, stock restored, and ledger
            updated.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesCodeDetailError'
          description: Validation failure or invalid return items.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesDetailError'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
          description: Authentication credentials were not provided or are invalid.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesCodeDetailError'
              examples:
                MonthlyTransactionLimitReached:
                  value:
                    code: PLAN_LIMIT_EXCEEDED
                    detail: Plan limit reached for 'max_transactions_per_month'. Upgrade
                      your subscription to continue processing sales.
                  summary: Monthly Transaction Limit Reached
                SubscriptionInactive:
                  value:
                    code: SUBSCRIPTION_INACTIVE
                    detail: Organization subscription is expired or inactive.
                  summary: Subscription Inactive
          description: The organization subscription is inactive or has reached plan
            limits (e.g. max_transactions_per_month).
        '403':
          content:
            application/json:
              schema:
