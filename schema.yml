      type: object
      properties:
        id:
          type: string
          readOnly: true
        unit_name:
          allOf:
          - $ref: '#/components/schemas/UnitNameEnum'
          description: |-
            Name of the alternative unit, e.g. 'carton'.

            * `pcs` - Piece(s)
            * `kg` - Kilogram
            * `g` - Gram
            * `l` - Litre
            * `ml` - Millilitre
            * `box` - Box
            * `pack` - Pack
            * `carton` - Carton
            * `dozen` - Dozen
            * `m` - Metre
            * `other` - Other
        multiplier:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          description: Multiplier against the base unit. E.g. if base is Pieces and
            unit is Carton of 12, multiplier is 12.
        price_override:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Optional specific selling price for this unit, overriding the
            multiplier math.
      required:
      - id
      - multiplier
      - unit_name
