    post:
      operationId: organizations_sales_create
      description: |-
        ### Overview
        Creates a new sale record along with its line items. Triggers atomic inventory deduction across batches, creates immutable ledger entries, and records unified business transactions (PRD §16, §26, §42).

        ### Warehouse & Stock Location Resolution
        - **`warehouse`** (UUID, optional): Target warehouse fulfilling the order.
        - **`location`** (UUID, optional): Specific shelf/bin stock location within the warehouse.
        - **Smart Automatic Fallback**: Both fields are optional in the request payload. If omitted, the backend automatically resolves and defaults to the organization's primary active warehouse (and its default stock location if one exists). For orders containing strictly service or non-inventory items, neither warehouse nor location is required.

        ### Payment Tender & Cash Change Due (PRD §39)
        - **Auto 'Pay in Full' (Omitted `amount`)**: If `payment.amount` is omitted or null, the backend automatically records the full outstanding net total as paid without requiring frontend calculation.
        - **Cash Overpayment & Change Due**: When paying via `cash`, if tendered `amount > total`, the backend records the exact net sale total as received revenue and returns the remaining customer change in `change_due` (e.g. ₦1,000 tendered on a ₦950 sale records ₦950 and returns `change_due: "50.00"`).
        - **Partial Payments**: If tendered `amount < total`, the payment records the partial amount and sets `payment_status: "partially_paid"`.
        - **Non-Cash Overpayment Guard**: Non-cash payment methods (`card`, `bank_transfer`, `pos`) strictly reject overpayments exceeding the payable total with HTTP 400.

        ### Required Permissions & Access Control (PRD §28, §55)
        - **`CREATE_SALE`**: Required to create sales orders.
        - **`APPLY_DISCOUNT`**: If `discount_amount > 0` or any line item specifies `discount > 0`, the caller MUST possess `APPLY_DISCOUNT` permission in the organization. Users lacking this permission (such as standard Sales Representatives) are rejected with HTTP 400 (`You do not have permission to apply discounts in this organization.`).

        ### Plan Limits & Subscription Invariants (PRD §10, §52)
        - **Active Subscription**: Calls `ensure_subscription_active(organization)`. Inactive or delinquent subscriptions reject order creation with HTTP 402/403 (`SUBSCRIPTION_INACTIVE`).
        - **Monthly Transactions Quota**: Creates a centralized system `Transaction` (type `SALE`, status `COMPLETED`), consuming transaction allowance via `consume_usage(organization, UsageMetric.TRANSACTIONS)`. If the monthly transaction limit is exceeded, order creation is rejected with HTTP 403 (`PLAN_LIMIT_REACHED`).

        ### Inventory & Ledger Invariants (PRD §16, §26, §42)
        When this endpoint executes inside its `@transaction.atomic` block:
        1. **Row-Level Locking**: Acquires `select_for_update()` locks on warehouse `Inventory` rows to eliminate race conditions.
        2. **FIFO Batch Deductions**: Sorts batches by `expiry_date ASC (nulls_last=True)` and `created_at ASC`. Depletes earliest expiring batches first.
        3. **Strict Stock Tracking (`track_inventory`)**:
           - When `product.track_inventory == True`: validates total available stock >= requested quantity. If insufficient stock, aborts with HTTP 400 (`Out of stock: {product.name}...`).
           - When `product.track_inventory == False`: allows stock to go negative for services, untracked items, or backorders.
        4. **Packaging Multipliers**: Automatically calculates base unit quantities using `unit_multiplier`.
        5. **Immutable Ledger**: Generates an `InventoryLedgerEntry` for every deducted batch (`quantity_moved = -qty`, `unit_cost = product.purchase_cost`).
        6. **Audit Trail**: Dispatches audit events `SALES_ORDER_CREATED` and `SALES_ORDER_FULFILLED`.
      summary: Create Sale (Fulfill & Deduct Stock)
