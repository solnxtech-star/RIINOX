          allOf:
          - $ref: '#/components/schemas/UnitNameEnum'
          description: |-
            Unit stock quantities for this product are counted in.

            * `pcs` - Piece(s)
            * `kg` - Kilogram
            * `g` - Gram
            * `l` - Litre
            * `ml` - Millilitre
            * `box` - Box
            * `pack` - Pack
            * `carton` - Carton
            * `dozen` - Dozen
            * `m` - Metre
            * `other` - Other
        product_type:
          allOf:
          - $ref: '#/components/schemas/ProductTypeEnum'
          description: |-
            Type of product (e.g., Physical, Service, Digital).

            * `physical` - Physical
            * `service` - Service
            * `digital` - Digital
            * `bundle` - Bundle
            * `consumable` - Consumable
            * `non_stock` - Non-Stock
        tax_config:
          allOf:
          - $ref: '#/components/schemas/TaxConfigEnum'
