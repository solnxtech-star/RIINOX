        - Unauthenticated requests return HTTP 401.
        - Authenticated callers without active membership or `VIEW_SALES` capability receive HTTP 403 Forbidden.

        ### Multi-Tenancy & Tenant Boundaries (PRD §6)
        - Filtered server-side using `Sale.objects.for_user(user)`.
        - Scoped to a specific tenant via the `?organization=<UUID>` query parameter or `X-Organization-ID` header.

        ### Plan Limits & Subscription Invariants (PRD §10, §52)
        - Read operations require active tenant organization standing.
        - Querying sales records is read-only and does NOT consume monthly transaction allowances (`max_transactions_per_month`).
      summary: List Sales
