                  brand: c3d4e5f6-a7b8-4901-d2e3-f4a5b6c7d8e9
                  description: Broad-spectrum antibacterial medication.
                  quality_grade: Grade A
                  unit_of_measurement: box
                  track_batches: true
                  purchase_cost: '1200.00'
                  vendor_sale_cost: '1400.00'
                  customer_sale_price: '2000.00'
                  minimum_stock_level: 20
                  quantity_in_stock: 50
                  warehouse_id: d4e5f6a7-b8c9-4012-e3f4-a5b6c7d8e9f0
                  batches:
                  - batch_number: AMX-2026-B1
                    expiry_date: '2027-12-31'
                    cost_price: '1200.00'
                    selling_price: '2000.00'
                  bulk_discounts:
                  - min_quantity: 10
                    discount_amount: '100.00'
                  unit_conversions:
                  - unit_name: carton
                    multiplier: '24.000'
                    price_override: '45000.00'
                summary: Update Product Payload
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductCreate'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreate'
          description: ''
    patch:
      operationId: organizations_products_partial_update
      description: |-
        Partially update selected fields on a product (e.g. updating only `customer_sale_price` or `status`).

        ### Permissions:
        - Changing price requires `EDIT_SELLING_PRICE`.
        - Changing costs requires `EDIT_PRODUCT_COSTS`.
