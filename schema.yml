      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPasswordRetype'
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRetype'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPasswordRetype'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetPasswordRetype'
          description: ''
components:
  schemas:
    AcceptInvitation:
      type: object
      description: |-
        Body of POST /invitations/accept/. Shape only: every rule (verified email,
        matching address, expiry, seats) lives in services.accept_invitation.
      properties:
        token:
          type: string
          description: The invitation token from the email link.
          pattern: ^[\w-]{20,128}$
      required:
      - token
    AccountNameEnum:
      enum:
      - cash_bank
      - accounts_receivable
      - accounts_payable
      - sales_revenue
      - cogs
      - inventory_asset
      - discounts
      - tax_payable
      type: string
      description: |-
        * `cash_bank` - Cash / Bank
        * `accounts_receivable` - Accounts Receivable
        * `accounts_payable` - Accounts Payable
        * `sales_revenue` - Sales Revenue
        * `cogs` - Cost of Goods Sold
        * `inventory_asset` - Inventory Asset
        * `discounts` - Discounts Given
        * `tax_payable` - Tax Payable
    Activation:
      type: object
      description: |-
        Serializer for user activation.
        It validates the token and checks if the user is active.
        If the user is active, it raises a PermissionDenied exception.
        If the token is invalid, it raises a BadRequest exception.
        If the user is not active, it returns the validated data.
      properties:
        email:
          type: string
          format: email
        token:
          type: string
      required:
      - email
      - token
    AddressTypeEnum:
      enum:
      - billing
      - shipping
      - both
      type: string
      description: |-
        * `billing` - Billing
        * `shipping` - Shipping
        * `both` - Both
    AdjustmentReasonEnum:
      enum:
      - damaged
      - missing
      - wrong_entry
      - unrecorded_return
      - warehouse_error
      - other
      type: string
      description: |-
        * `damaged` - Damaged
        * `missing` - Missing
        * `wrong_entry` - Wrong Entry
        * `unrecorded_return` - Unrecorded Return
        * `warehouse_error` - Warehouse Error
        * `other` - Other
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    BlankEnum:
      enum:
      - ''
    Brand:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          title: Brand Name
          description: Manufacturer or brand name, e.g. 'Dangote'.
          maxLength: 150
        is_active:
          type: boolean
          description: Inactive brands are hidden from product-creation pickers.
        organization:
          type: string
          readOnly: true
          description: Organization this brand belongs to.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - organization
      - updated_at
    BusinessType:
      type: object
      description: Catalog entry; feeds the onboarding cards.
      properties:
        id:
          type: string
          readOnly: true
        code:
          type: string
          readOnly: true
          description: Stable key, e.g. 'wholesale_distribution'.
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        icon:
          type: string
          readOnly: true
          description: Icon key resolved by the frontend, e.g. 'shopping-basket'.
        highlights:
          readOnly: true
          description: Short feature tags shown on the onboarding card.
      required:
      - code
      - description
      - highlights
      - icon
      - id
      - name
    Category:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          title: Category Name
          description: Display name of the category, e.g. 'Beverages'.
          maxLength: 150
        description:
          type: string
          nullable: true
          description: Optional longer description of what belongs in this category.
        is_active:
          type: boolean
          description: Inactive categories are hidden from product-creation pickers.
        organization:
          type: string
          readOnly: true
          description: Organization this category belongs to.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - organization
      - updated_at
    ConditionEnum:
      enum:
      - new
      - open_box
      - damaged
      - defective
      type: string
      description: |-
        * `new` - New
        * `open_box` - Open Box
        * `damaged` - Damaged
        * `defective` - Defective
    CustomTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    CustomUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Full Name
          maxLength: 255
        is_active:
          type: boolean
          title: Active
        email:
          type: string
          format: email
          title: Email Address
          maxLength: 254
      required:
      - email
      - id
    CustomUserCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Full Name
          maxLength: 255
        email:
          type: string
          format: email
          title: Email Address
          maxLength: 254
        password:
          type: string
          writeOnly: true
        re_password:
          type: string
          writeOnly: true
      required:
      - email
      - id
      - password
      - re_password
    Customer:
      type: object
      description: Standard read/detail representation for customer records.
      properties:
        id:
          type: string
          readOnly: true
        organization:
          type: string
          readOnly: true
          description: Tenant organization owning this customer record.
        customer_type:
          $ref: '#/components/schemas/CustomerTypeEnum'
        name:
          type: string
          description: Full name of individual customer or primary contact.
          maxLength: 255
        company_name:
          type: string
          description: Registered legal company name for corporate/B2B clients.
          maxLength: 255
        email:
          type: string
          format: email
          default: ''
          description: Primary billing or notification email.
          maxLength: 254
        phone:
          type: string
          default: ''
          description: Primary contact or WhatsApp phone number.
          maxLength: 35
        tax_id:
          type: string
          description: Tax Identification Number (TIN/VAT) for formal invoice issuance.
          maxLength: 50
        credit_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Maximum outstanding credit allowed. 0.00 prevents purchasing
            on credit.
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: Current outstanding receivable balance; derived from sales
            and payment ledgers.
        payment_terms_days:
          type: integer
          maximum: 32767
          minimum: 0
          description: Credit payment due terms in days (e.g. Net 0, Net 15, Net 30).
        status:
          $ref: '#/components/schemas/StatusCa5Enum'
        notes:
          type: string
          nullable: true
          description: Internal staff notes regarding preferences or credit terms.
        metadata:
          description: Extensible industry-specific attributes (student ID, patient
            ID, etc.).
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/CustomerAddress'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - addresses
      - balance
      - created_at
      - id
      - name
      - organization
      - updated_at
    CustomerAddress:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        address_type:
          $ref: '#/components/schemas/AddressTypeEnum'
        street:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 100
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - street
    CustomerCreate:
      type: object
      description: |-
        Write-side serializer for creating and updating customer records.
        Guards credit limits, balances, and tenant boundaries.
      properties:
        id:
          type: string
          readOnly: true
        customer_type:
          $ref: '#/components/schemas/CustomerTypeEnum'
        name:
          type: string
          description: Full name of individual customer or primary contact.
          maxLength: 255
        company_name:
          type: string
          description: Registered legal company name for corporate/B2B clients.
          maxLength: 255
        email:
          type: string
          format: email
          description: Primary billing or notification email.
          maxLength: 254
        phone:
          type: string
          description: Primary contact or WhatsApp phone number.
          maxLength: 35
        tax_id:
          type: string
          description: Tax Identification Number (TIN/VAT) for formal invoice issuance.
          maxLength: 50
        credit_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        payment_terms_days:
          type: integer
          minimum: 0
          default: 0
        status:
          $ref: '#/components/schemas/StatusCa5Enum'
        notes:
          type: string
          nullable: true
          description: Internal staff notes regarding preferences or credit terms.
        metadata:
          description: Extensible industry-specific attributes (student ID, patient
            ID, etc.).
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/CustomerAddress'
      required:
      - id
      - name
    CustomerCreditAdjustment:
      type: object
      description: Dedicated serializer for adjusting credit limits and terms.
      properties:
        credit_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: New credit limit amount.
        payment_terms_days:
          type: integer
          minimum: 0
          description: Updated payment terms in days.
        reason:
          type: string
          default: ''
          description: Audit justification for adjusting credit terms.
          maxLength: 255
      required:
      - credit_limit
    CustomerTypeEnum:
      enum:
      - individual
      - business
      type: string
      description: |-
        * `individual` - Individual
        * `business` - Business
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    DiscountTypeEnum:
      enum:
      - percentage
      - fixed
      type: string
      description: |-
        * `percentage` - Percentage
        * `fixed` - Fixed Amount
    Error:
      type: object
      description: Shape of every business-rule error (PRD §46). Used for API docs
        only.
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        detail:
          type: string
          description: Human-readable message.
      required:
      - code
      - detail
    FinancialLedgerEntry:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        transaction:
          type: string
        account_name:
          $ref: '#/components/schemas/AccountNameEnum'
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: Amount debited to the account. Increases Assets/Expenses, decreases
            Liabilities/Revenue/Equity.
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: Amount credited to the account. Increases Liabilities/Revenue/Equity,
            decreases Assets/Expenses.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_name
      - created_at
      - id
      - transaction
      - updated_at
    FulfillmentStatusEnum:
      enum:
      - unfulfilled
      - partially_fulfilled
      - fulfilled
      - canceled
      - returned
      type: string
      description: |-
        * `unfulfilled` - Unfulfilled
        * `partially_fulfilled` - Partially Fulfilled
        * `fulfilled` - Fulfilled
        * `canceled` - Canceled
        * `returned` - Returned
    GetUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: Email Address
          maxLength: 254
        name:
          type: string
          title: Full Name
          maxLength: 255
        is_active:
          type: boolean
          title: Active
      required:
      - email
      - id
    Inventory:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        visible:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        quantity:
          type: integer
          readOnly: true
          description: Current on-hand quantity. System-maintained — see InventoryLedgerEntry.
        product:
          type: string
          description: Product this stock level is for.
        variant:
          type: string
          nullable: true
          description: Specific variant of the product, if applicable.
        batch:
          type: string
          nullable: true
          description: Specific batch of the product, if applicable.
        warehouse:
          type: string
          description: Warehouse this stock level applies to.
        location:
          type: string
          nullable: true
          description: Specific shelf/rack this stock is placed at, if tracked.
      required:
      - created_at
      - id
      - product
      - quantity
      - updated_at
      - warehouse
    InventoryLedgerEntry:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        visible:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        quantity_moved:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Positive for stock coming in, negative for stock going out.
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Cost basis per unit at the time of movement, useful for COGS
            calculation.
        transaction:
          type: string
        product:
          type: string
        variant:
          type: string
          nullable: true
          description: Optional specific variant involved in the movement.
        batch:
          type: string
          nullable: true
          description: Optional specific batch involved in the movement.
        warehouse:
          type: string
      required:
      - created_at
      - id
      - product
      - quantity_moved
      - transaction
      - updated_at
      - warehouse
    Invitation:
      type: object
      description: Staff-side list/detail. Never exposes the token or its hash.
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Invitee name
        email:
          type: string
          format: email
          readOnly: true
          title: Invitee email
        role:
          type: string
          readOnly: true
        role_name:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        last_sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        invited_by_name:
          type: string
          readOnly: true
          nullable: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - accepted_at
      - created_at
      - email
      - expires_at
      - id
      - invited_by_name
      - last_sent_at
      - name
      - revoked_at
      - role
      - role_name
      - status
    InvitationAccepted:
      type: object
      description: 'Response of a successful accept: what the frontend needs to switch
        organization.'
      properties:
        membership_id:
          type: string
          readOnly: true
        organization_id:
          type: string
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
      required:
      - membership_id
      - organization_id
      - organization_name
      - role
    InvitationCreate:
      type: object
      description: |-
        Body of POST /organizations/{organization_id}/invitations/.

        The organization comes from the URL, never the body. The view supplies
        `organization` and `actor_membership` through the serializer context.
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        role:
          type: string
      required:
      - email
      - name
      - role
    InvitationPreview:
      type: object
      description: |-
        Public preview shown before the invitee signs up or logs in. Deliberately
        minimal: no ids, no token, no other members, and a masked email.
      properties:
        organization:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Invitee name
        invited_email:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - expires_at
      - invited_email
      - name
      - organization
      - role
    InvitationRevoke:
      type: object
      description: Optional body of POST .../invitations/{id}/revoke/; the reason
        goes to the audit log.
      properties:
        reason:
          type: string
          default: ''
          maxLength: 500
    InvitationSent:
      type: object
      properties:
        detail:
          type: string
        id:
          type: string
          readOnly: true
      required:
      - detail
      - id
    Membership:
      type: object
      description: |-
        Membership detail (read-only). Every row is a real member; pending
        invitations are a separate resource. Load with
        Membership.objects.with_user_and_role().select_related("organization").
      properties:
        id:
          type: string
          readOnly: true
        user:
          type: integer
          readOnly: true
        user_name:
          type: string
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        organization:
          type: string
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
          description: Must belong to the same organization as this membership.
        role_name:
          type: string
          readOnly: true
        role_slug:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          description: Inactive memberships grant nothing (suspended or removed member).
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - organization
      - organization_name
      - role
      - role_name
      - role_slug
      - user
      - user_email
      - user_name
    MembershipUpdate:
      type: object
      description: |-
        Body of PUT/PATCH /memberships/{id}/: change a member's role and/or active
        flag. Who may change whom is enforced in services.update_membership.
        (Unchanged: `role` and `is_active` still exist on Membership.)
      properties:
        role:
          type: string
          description: Must belong to the same organization as this membership.
        is_active:
          type: boolean
          description: Inactive memberships grant nothing (suspended or removed member).
      required:
      - role
    NullEnum:
      enum:
      - null
    Option:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
      - code
      - name
    Organization:
      type: object
      description: |-
        Read serializer. Load through Organization.objects.for_user(user).with_detail()
        so plan and business types are preloaded. Members are intentionally NOT
        embedded: use the members action.
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          description: Trading name.
        legal_name:
          type: string
          readOnly: true
        business_types:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationBusinessType'
          readOnly: true
        primary_business_type:
          type: string
          nullable: true
          readOnly: true
        registration_number:
          type: string
          readOnly: true
        state:
          type: string
          readOnly: true
          description: State/province/region of the business address.
        address:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        staff_size:
          allOf:
          - $ref: '#/components/schemas/StaffSizeEnum'
          readOnly: true
          title: Number of staff
        country:
          type: string
          readOnly: true
          description: ISO 3166-1 alpha-2 country code.
        currency:
          type: string
          readOnly: true
          description: ISO 4217 currency code.
        timezone:
          type: string
          readOnly: true
        domain:
          type: string
          readOnly: true
          nullable: true
          title: Custom Domain
          description: Optional custom domain (e.g. acme.com).
        logo:
          type: string
          format: uri
          readOnly: true
          nullable: true
          description: Logo to display on invoices and receipts.
        plan:
          allOf:
          - $ref: '#/components/schemas/Plan'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - business_types
      - country
      - created_at
      - currency
      - domain
      - email
      - id
      - is_active
      - legal_name
      - logo
      - name
      - phone
      - plan
      - primary_business_type
      - registration_number
      - staff_size
      - state
      - timezone
      - updated_at
    OrganizationBusinessType:
      type: object
      description: A business type as attached to one organization.
      properties:
        id:
          type: string
          readOnly: true
        code:
          type: string
          description: Stable key, e.g. 'wholesale_distribution'.
          readOnly: true
        name:
          type: string
          readOnly: true
        is_primary:
          type: boolean
          readOnly: true
      required:
      - code
      - id
      - is_primary
      - name
    OrganizationBusinessTypesUpdate:
      type: object
      description: |-
        Body of PUT /organizations/{id}/business-types/ (replaces the whole set).
            {"business_types": ["retail", "wholesale_distribution"],
             "primary_business_type": "retail"}
      properties:
        business_types:
          type: array
          items:
            type: string
            description: Stable key, e.g. 'wholesale_distribution'.
        primary_business_type:
          type: string
          description: Stable key, e.g. 'wholesale_distribution'.
      required:
      - business_types
      - primary_business_type
    OrganizationCreate:
      type: object
      description: |-
        Body of POST /organizations/: onboarding screen 1 (business type) and
        screen 2 (business details) submitted together, so no half-created
        organization can exist.

        Branding and templates belong to a later onboarding step.

        Timezone is not collected from the onboarding request. The service layer
        applies the default timezone of Africa/Lagos through OrganizationProfile.
      properties:
        id:
          type: string
          readOnly: true
        business_type:
          type: string
          description: Stable key, e.g. 'wholesale_distribution'.
          writeOnly: true
        name:
          type: string
          description: Trading name.
          maxLength: 255
        registration_number:
          type: string
          maxLength: 100
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          maxLength: 2
        state:
          type: string
          description: State/province/region of the business address.
          maxLength: 100
        address:
          type: string
        postal_code:
          type: string
          nullable: true
          title: Postal/ZIP code
          maxLength: 20
        tax_id:
          type: string
          maxLength: 100
        currency:
          type: string
          description: ISO 4217 currency code.
          maxLength: 3
        phone:
          type: string
          maxLength: 30
        staff_size:
          allOf:
          - $ref: '#/components/schemas/StaffSizeEnum'
          title: Number of staff
      required:
      - address
      - business_type
      - country
      - currency
      - id
      - name
      - phone
      - staff_size
      - state
    OrganizationMember:
      type: object
      description: |-
        One row of GET /organizations/{id}/members/. Pending invitations have no
        user yet, so `user` falls back to the invited email; `accepted` tells them
        apart. Load rows with Membership.objects.with_user_and_role().
      properties:
        id:
          type: string
          readOnly: true
        user:
          type: string
          format: email
          readOnly: true
          description: Email of the member, or the invited email for a pending invite
        role:
          type: string
          readOnly: true
          description: Role name, e.g. Administrator
        active:
          type: boolean
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - id
      - joined_at
      - role
      - user
    OrganizationUpdate:
      type: object
      description: |-
        Body of PUT/PATCH /organizations/{id}/ (profile + branding). Business types
        have their own action.

        country and currency are deliberately not editable here: they are fixed at
        creation, because changing currency after transactions exist would rewrite
        the meaning of historical records. State and phone are still validated
        against the organization's stored country (see the validation mixin).

        Template fields are generated from the model FKs (so `limit_choices_to` on
        type/active still applies) and re-scoped per organization in get_fields():
        shared defaults + this organization's own templates. Without that, any
        organization could assign another tenant's custom template by primary key.
      properties:
        name:
          type: string
          description: Trading name.
          maxLength: 255
        legal_name:
          type: string
          maxLength: 255
        registration_number:
          type: string
          maxLength: 100
        tax_id:
          type: string
          maxLength: 100
        state:
          type: string
          description: State/province/region of the business address.
          maxLength: 100
        address:
          type: string
        postal_code:
          type: string
          nullable: true
          title: Postal/ZIP code
          maxLength: 20
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 254
        staff_size:
          title: Number of staff
          oneOf:
          - $ref: '#/components/schemas/StaffSizeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        timezone:
          type: string
          maxLength: 64
        domain:
          type: string
          nullable: true
          title: Custom Domain
          description: Optional custom domain (e.g. acme.com).
          maxLength: 255
        logo:
          type: string
          format: uri
          nullable: true
          description: Logo to display on invoices and receipts.
        header_text:
          type: string
          nullable: true
          maxLength: 255
        footer_text:
          type: string
          nullable: true
          maxLength: 255
        invoice_template:
          type: string
          nullable: true
        receipt_template:
          type: string
          nullable: true
