        ### Line Item Details (PRD §18)
        Each line item details the ordered `quantity_ordered`, the fulfilled `quantity_received`, the unit of measurement (`unit`), and the cost per unit (`purchase_cost`).

        ### Immutability & Audit Trail
        The `purchase_cost` on each line item is permanently snapshotted at order creation time. Subsequent price changes in the master product catalog do not rewrite historical procurement costs.
      summary: Retrieve a Purchase Order
