                  $ref: '#/components/schemas/SaleReturn'
          description: Successful retrieval of returns list
    post:
      operationId: sales_returns_create
      description: |-
        Create a new sale return against an original sale, specifying the returned items.

        What happens in one transaction:

        - the `SaleReturn` and `SaleReturnItem` records are created;
        - returned stock is added back to the `Inventory` pool (if `restock_action="return_to_stock"`) via `update_inventory_for_return`;
        - an `InventoryLedgerEntry` is recorded.

        Where the values come from:

        - `original_sale`: GET `/api/sales/sales/`
        - `sale_item` (in items): Must be an ID from the original sale's items.
        - `restock_action` (in items): Must be `return_to_stock` or `damage`.

        `refund_amount` and `condition` are required fields for the return items.
      summary: Create Sale Return
      tags:
      - Sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleReturnCreate'
            examples:
              ExampleSaleReturnRequest:
                value:
                  original_sale: 1
                  organization: 1
                  return_reason: DEFECTIVE
                  refund_amount: '250.00'
                  refund_method: original_payment
                  items:
                  - sale_item: 1
                    quantity: 1
                    refund_amount: '250.00'
                    condition: defective
                    restock_action: return_to_stock
                summary: Standard return payload
                description: Provides original_sale ID, organization, and the specific
                  items being returned. 'sale_return' and 'id' should be omitted in
                  the items array.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaleReturnCreate'
          multipart/form-data:
