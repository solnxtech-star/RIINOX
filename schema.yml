        * `blocked` - Blocked
    StatusD6cEnum:
      enum:
      - active
      - inactive
      - discontinued
      - archived
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `discontinued` - Discontinued
        * `archived` - Archived
    StatusFa7Enum:
      enum:
      - pending
      - completed
      - reversed
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `completed` - Completed
        * `reversed` - Reversed
        * `failed` - Failed
    StockAdjustmentRequest:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        visible:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        requested_quantity_change:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: 'Signed: positive to add stock, negative to remove.'
        requested_unit:
          type: string
          nullable: true
          description: The unit selected by the user in the UI (e.g. 'Bottle').
          maxLength: 50
        adjustment_reason:
          nullable: true
          description: |-
            Standardized reason for this adjustment.

            * `damaged` - Damaged
            * `missing` - Missing
            * `wrong_entry` - Wrong Entry
            * `unrecorded_return` - Unrecorded Return
            * `warehouse_error` - Warehouse Error
            * `other` - Other
          oneOf:
          - $ref: '#/components/schemas/AdjustmentReasonEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        notes:
          type: string
          nullable: true
          description: Optional note for this adjustment.
        status:
          allOf:
          - $ref: '#/components/schemas/StockAdjustmentRequestStatusEnum'
          readOnly: true
          description: |-
            Approval state — only APPROVED requests result in a stock movement.

            * `not_required` - Not Required
            * `pending` - Pending Approval
            * `approved` - Approved
            * `rejected` - Rejected
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When this request was approved or rejected.
        rejection_reason:
          type: string
          readOnly: true
          nullable: true
          description: Required explanation when the request is rejected.
        product:
          type: string
          description: Product the adjustment applies to.
        variant:
          type: string
          nullable: true
          description: Variant the adjustment applies to, if applicable.
        batch:
          type: string
          nullable: true
          description: Batch the adjustment applies to, if applicable.
        warehouse:
          type: string
          description: Warehouse the adjustment applies to.
        requested_by:
          type: integer
          readOnly: true
          nullable: true
          description: User who raised this request.
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
          description: Admin/Owner who approved or rejected this request.
      required:
      - created_at
      - id
      - product
      - rejection_reason
      - requested_by
      - requested_quantity_change
      - reviewed_at
      - reviewed_by
      - status
      - updated_at
      - warehouse
    StockAdjustmentRequestStatusEnum:
      enum:
      - not_required
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `not_required` - Not Required
        * `pending` - Pending Approval
        * `approved` - Approved
        * `rejected` - Rejected
