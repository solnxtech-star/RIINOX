            * `physical` - Physical
            * `service` - Service
            * `digital` - Digital
            * `bundle` - Bundle
            * `consumable` - Consumable
            * `non_stock` - Non-Stock
        tax_config:
          allOf:
          - $ref: '#/components/schemas/TaxConfigEnum'
