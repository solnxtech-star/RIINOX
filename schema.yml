  /api/organizations/{id}/:
    get:
      operationId: organizations_retrieve
      description: A single organization with its plan and business types. Available
        to every active member of the organization. Members and roles have their own
        endpoints.
      summary: Retrieve an organization
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A UUID string identifying this Organization.
        required: true
      tags:
      - Organizations
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: The organization.
        '401':
          description: Authentication credentials were not provided or are invalid.
        '404':
          description: Not found. Also returned when the resource belongs to an organization
            the caller isn't a member of.
    put:
      operationId: organizations_update
      description: |-
        Updates the organization's profile and branding: name, contact details, address and postal code, tax ID, CAC/RC number, timezone, logo, header/footer and document templates. **Administrators and Owners** only.

        - `country` and `currency` are fixed after creation, and business types have their own endpoint. Sending either field is ignored.
        - `state` is validated against the organization's stored country, and `phone` is normalised to international format using it.
        - A document template must be a shared default or one owned by this organization; **custom templates** additionally require a plan that includes them.

        Returns the full organization.
      summary: Update an organization
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A UUID string identifying this Organization.
        required: true
      tags:
      - Organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: The updated organization.
        '400':
          description: Validation error.
        '401':
          description: Authentication credentials were not provided or are invalid.
        '403':
          description: The caller is a member but not an Administrator or Owner of
            this organization.
        '404':
          description: Not found. Also returned when the resource belongs to an organization
            the caller isn't a member of.
    patch:
      operationId: organizations_partial_update
      description: |-
