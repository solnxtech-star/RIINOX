            * `kg` - Kilogram
            * `g` - Gram
            * `l` - Litre
            * `ml` - Millilitre
            * `box` - Box
            * `pack` - Pack
            * `carton` - Carton
            * `dozen` - Dozen
            * `m` - Metre
            * `other` - Other
