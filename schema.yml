            * `taxable` - Taxable
            * `non_taxable` - Non-Taxable
            * `exempt` - Exempt
        tax_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Specific percentage tax rate override, if applicable.
        track_inventory:
          type: boolean
          description: Whether to enforce inventory ledger tracking for this product.
        track_batches:
          type: boolean
          description: Whether to enforce batch tracking requirements for this product.
        purchase_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
