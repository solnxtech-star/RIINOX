  /api/sales/:
    get:
      operationId: sales_list
      description: Retrieve a paginated list of all sales records.
      summary: List Sales
      tags:
      - Sales
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sale'
          description: Successful retrieval of sales list
    post:
      operationId: sales_create
      description: |-
        Create a new sale record along with its line items. Triggers inventory update, ledger entry, and invoicing.

        What happens in one transaction:

        - the `Sale` and multiple `SaleItem` records are created;
        - inventory quantities are deducted automatically across batches using FIFO via the `update_inventory_for_sale` service;
        - an `InventoryLedgerEntry` is logged for every stock movement.

        Where the values come from:

        - `organization`: GET `/api/organizations/`
        - `customer`: GET `/api/users/customers/`
        - `location`: GET `/api/warehouse/warehouses/`
        - `product` (in items): GET `/api/products/products/`
        - `unit_name` (in items): Optional, must match one of the product's `unit_conversions` or base unit.

        `items` must be an array of sale items. `quantity` is multiplied by the unit's `multiplier` behind the scenes.
      summary: Create Sale
      tags:
      - Sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCreate'
            examples:
              ExampleSaleRequest:
                value:
                  organization: 1
                  customer: 1
                  location: 1
                  sales_rep: 1
                  payment_status: unpaid
                  fulfillment_status: unfulfilled
                  currency: USD
                  reference_number: PO-12345
                  due_date: '2026-10-31'
                  billing_address: 123 Business Rd
                  shipping_address: 456 Logistics Ave
                  subtotal: '500.00'
                  discount_amount: '50.00'
                  tax_amount: '22.50'
                  notes: Thank you for shopping with us.
                  items:
                  - product: 1
                    variant: 1
                    product_name: Pro Widget v2
                    product_sku: WDG-PRO-2
                    quantity: 2
                    unit_price: '250.00'
                    discount: '25.00'
                    discount_type: fixed
                    tax: '11.25'
                    tax_rate: '5.00'
                summary: Standard sale payload
                description: Provides organization, customer, location, sales rep,
                  and a list of sale items. Note that 'id', 'sale', and 'total' are
                  not required in the items list during creation.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaleCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaleCreate'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
          description: Sale created successfully
