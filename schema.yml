          type: string
        description: A UUID string identifying this Product.
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{32,36}$
        required: true
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductCreate'
      security:
