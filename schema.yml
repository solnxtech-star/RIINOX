          description: INVITATION_NOT_PENDING
  /api/organizations/{organization_id}/invitations/roles/:
    get:
      operationId: organization_invitations_roles
      description: |-
        Feeds the **Assign Role** dropdown of the invite form. Call it when the form opens and send the chosen `id` as `role` in the create request.

        **Permission:** `INVITE_TEAM_MEMBER`.

        **Auth:** requires a valid access token (`401` otherwise). The organization in the URL is checked against the caller's active membership: if the caller is not a member, the API answers `404` (not `403`), so the existence of other organizations is never revealed.

        **What is returned depends on who is calling:**
        - **Owner** of the organization: every role except Owner.
        - **Anyone else with permission to invite:** every role except Owner and Administrator.

        **Important:** role ids are per organization. Each organization has its own copy of Manager, Accountant, etc., so ids from one organization are rejected by another. Fetch the roles from the same `organization_id` you invite into, and refetch when the user switches organization.

        Not paginated. `is_system` is `true` for the built-in roles (they cannot be renamed or deleted); custom roles have `false`.
      summary: Roles the caller can assign
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: path
        name: organization_id
        schema:
          type: string
        description: The organization whose team is being managed. The caller must
          have an active membership in it. It always comes from the URL and is never
          read from the request body.
        required: true
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Team invitations
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleOption'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: NOT_AUTHENTICATED
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: PERMISSION_DENIED
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: NOT_ORGANIZATION_MEMBER
