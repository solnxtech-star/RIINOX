        ### Overview
        Replaces all editable fields of an existing purchase order and refreshes its line items.

        ### Required Permissions & Access Control (PRD §28, §55)
        - Requires **`CREATE_PURCHASE`** permission in the organization.

        ### Plan Limits & Subscription Invariants (PRD §10, §52)
        - Evaluates `ensure_subscription_active(organization)` to ensure account is in good standing.

        ### PRD Data Integrity Constraint (PRD §18 & §44)
        **Line items cannot be modified once goods have been received.**
        - If any line item has `quantity_received > 0`, attempting to rewrite line items will be rejected with HTTP 400 (`Cannot modify line items on a purchase order that has already received goods`).
        - This guarantees that ledger entries created during goods receipt always link to immutable, historical line items.

        ### Product & Line Item Revision
        To revise ordered products, quantities, or negotiated costs on a draft order before receiving, provide a complete updated `items` array with the target `product` UUIDs.

        ### Lifecycle Transitions & Audit
        - Transitioning `status` to `ordered` emits an audit record (`PURCHASE_ORDER_APPROVED`).
        - Standard field edits emit an audit event (`PURCHASE_ORDER_UPDATED`) tracking previous and updated values.
