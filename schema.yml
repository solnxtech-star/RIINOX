    delete:
      operationId: organizations_purchases_destroy
      description: |-
        ### Overview
        Permanently deletes an unfulfilled purchase order record.

        ### Required Permissions & Access Control (PRD §28, §55)
        - Requires **`CREATE_PURCHASE`** permission in the organization.

        ### Strict Data Integrity & Audit Rule (PRD §18 & §44)
        **Orders that have received goods cannot be deleted.**
        - If any line item has `quantity_received > 0`, the deletion request is blocked and returns HTTP 400 (`CANNOT_DELETE_RECEIVED_PURCHASE`). The order must be cancelled instead.
        - Protecting fulfilled orders prevents silent inventory variances and preserves the audit chain: `Supplier > Purchase > Receiving > Inventory` (PRD §31).

        ### Audit Event
        - Deleting an unreceived draft purchase order dispatches an immutable audit log (`purchase_order.deleted`).
      summary: Delete a Purchase Order
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A UUID string identifying this Purchase.
        required: true
      - in: path
        name: organization_id
        schema:
