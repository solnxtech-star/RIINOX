components:
  schemas:
    AcceptInvitation:
      type: object
      description: |-
        Body of POST /invitations/accept/. Shape only: every rule (verified email,
        matching address, expiry, seats) lives in services.accept_invitation.
      properties:
        token:
          type: string
          description: The invitation token from the email link.
          pattern: ^[\w-]{20,128}$
      required:
      - token
    Activation:
      type: object
      description: |-
        Serializer for user activation.
        It validates the token and checks if the user is active.
        If the user is active, it raises a PermissionDenied exception.
        If the token is invalid, it raises a BadRequest exception.
        If the user is not active, it returns the validated data.
      properties:
        email:
          type: string
          format: email
        token:
          type: string
      required:
      - email
      - token
    AdjustmentReasonEnum:
      enum:
      - damaged
      - missing
      - wrong_entry
      - unrecorded_return
      - warehouse_error
      - other
      type: string
      description: |-
        * `damaged` - Damaged
        * `missing` - Missing
        * `wrong_entry` - Wrong Entry
        * `unrecorded_return` - Unrecorded Return
        * `warehouse_error` - Warehouse Error
        * `other` - Other
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    BlankEnum:
      enum:
      - ''
    BusinessType:
      type: object
      description: Catalog entry; feeds the onboarding cards.
      properties:
        id:
          type: string
          readOnly: true
        code:
          type: string
          readOnly: true
          description: Stable key, e.g. 'wholesale_distribution'.
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        icon:
          type: string
          readOnly: true
          description: Icon key resolved by the frontend, e.g. 'shopping-basket'.
        highlights:
          readOnly: true
          description: Short feature tags shown on the onboarding card.
      required:
      - code
      - description
      - highlights
      - icon
      - id
      - name
    ConditionEnum:
      enum:
      - new
      - open_box
      - damaged
      - defective
      type: string
      description: |-
        * `new` - New
        * `open_box` - Open Box
        * `damaged` - Damaged
        * `defective` - Defective
    CustomTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    CustomUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Full Name
          maxLength: 255
        is_active:
          type: boolean
          title: Active
        email:
          type: string
          format: email
          title: Email Address
          maxLength: 254
      required:
      - email
      - id
    CustomUserCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Full Name
          maxLength: 255
        email:
          type: string
          format: email
          title: Email Address
          maxLength: 254
        password:
          type: string
          writeOnly: true
        re_password:
          type: string
          writeOnly: true
      required:
      - email
      - id
      - password
      - re_password
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    DiscountTypeEnum:
      enum:
      - percentage
      - fixed
      type: string
      description: |-
        * `percentage` - Percentage
        * `fixed` - Fixed Amount
    Error:
      type: object
      description: Shape of every business-rule error (PRD §46). Used for API docs
        only.
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        detail:
          type: string
          description: Human-readable message.
      required:
      - code
      - detail
    FulfillmentStatusEnum:
      enum:
      - unfulfilled
      - partially_fulfilled
      - fulfilled
      - canceled
      type: string
      description: |-
        * `unfulfilled` - Unfulfilled
        * `partially_fulfilled` - Partially Fulfilled
        * `fulfilled` - Fulfilled
        * `canceled` - Canceled
    GetUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: Email Address
          maxLength: 254
        name:
          type: string
          title: Full Name
          maxLength: 255
        is_active:
          type: boolean
          title: Active
      required:
      - email
      - id
    Inventory:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        visible:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        quantity:
          type: integer
          readOnly: true
          description: Current on-hand quantity. System-maintained — see InventoryLedgerEntry.
        product:
          type: string
          description: Product this stock level is for.
        variant:
          type: string
          nullable: true
          description: Specific variant of the product, if applicable.
        batch:
          type: string
          nullable: true
          description: Specific batch of the product, if applicable.
        warehouse:
          type: string
          description: Warehouse this stock level applies to.
        location:
          type: string
          nullable: true
          description: Specific shelf/rack this stock is placed at, if tracked.
      required:
      - created_at
      - id
      - product
      - quantity
      - updated_at
      - warehouse
    InventoryLedgerEntry:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        visible:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        quantity_moved:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Positive for stock coming in, negative for stock going out.
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Cost basis per unit at the time of movement, useful for COGS
            calculation.
        transaction:
          type: string
        product:
          type: string
        variant:
          type: string
          nullable: true
          description: Optional specific variant involved in the movement.
        batch:
          type: string
          nullable: true
          description: Optional specific batch involved in the movement.
        warehouse:
          type: string
      required:
      - created_at
      - id
      - product
      - quantity_moved
      - transaction
      - updated_at
      - warehouse
    Invitation:
      type: object
      description: Staff-side list/detail. Never exposes the token or its hash.
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Invitee name
        email:
          type: string
          format: email
          readOnly: true
          title: Invitee email
        role:
          type: string
          readOnly: true
        role_name:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        last_sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        invited_by_name:
          type: string
          readOnly: true
          nullable: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - accepted_at
      - created_at
      - email
      - expires_at
      - id
      - invited_by_name
      - last_sent_at
      - name
      - revoked_at
      - role
      - role_name
      - status
    InvitationAccepted:
      type: object
      description: 'Response of a successful accept: what the frontend needs to switch
        organization.'
      properties:
        membership_id:
          type: string
          readOnly: true
        organization_id:
          type: string
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
      required:
      - membership_id
      - organization_id
      - organization_name
      - role
    InvitationCreate:
      type: object
      description: |-
        Body of POST /organizations/{organization_id}/invitations/.

        The organization is never in the body: it comes from the URL, verified
        against the caller's membership. The view passes `organization` and
        `actor_membership` in the serializer context.
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        role:
          type: string
      required:
      - email
      - name
      - role
    InvitationPreview:
      type: object
      description: |-
        Public preview shown before the invitee signs up or logs in. Deliberately
        minimal: no ids, no token, no other members, and a masked email.
      properties:
        organization:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Invitee name
        invited_email:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - expires_at
      - invited_email
      - name
      - organization
      - role
    InvitationRevoke:
      type: object
      description: Optional body of POST .../invitations/{id}/revoke/; the reason
        goes to the audit log.
      properties:
        reason:
          type: string
          default: ''
          maxLength: 500
    InvitationSent:
      type: object
      properties:
        detail:
          type: string
        id:
          type: string
          readOnly: true
      required:
      - detail
      - id
    Membership:
      type: object
      description: |-
        Membership detail (read-only). Every row is a real member; pending
        invitations are a separate resource. Load with
        Membership.objects.with_user_and_role().select_related("organization").
      properties:
        id:
          type: string
          readOnly: true
        user:
          type: integer
          readOnly: true
        user_name:
          type: string
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        organization:
          type: string
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
          description: Must belong to the same organization as this membership.
        role_name:
          type: string
          readOnly: true
        role_slug:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          description: Inactive memberships grant nothing (suspended or removed member).
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - organization
      - organization_name
      - role
      - role_name
      - role_slug
      - user
      - user_email
      - user_name
    MembershipUpdate:
      type: object
      description: |-
        Body of PUT/PATCH /memberships/{id}/: change a member's role and/or active
        flag. Who may change whom is enforced in services.update_membership.
        (Unchanged: `role` and `is_active` still exist on Membership.)
      properties:
        role:
          type: string
          description: Must belong to the same organization as this membership.
        is_active:
          type: boolean
          description: Inactive memberships grant nothing (suspended or removed member).
      required:
      - role
    NullEnum:
      enum:
      - null
    Option:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
      - code
      - name
    Organization:
      type: object
      description: |-
        Read serializer. Load through Organization.objects.for_user(user).with_detail()
        so plan and business types are preloaded. Members are intentionally NOT
        embedded: use the members action.
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          description: Trading name.
        legal_name:
          type: string
          readOnly: true
        business_types:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationBusinessType'
          readOnly: true
        primary_business_type:
          type: string
          nullable: true
          readOnly: true
        registration_number:
          type: string
          readOnly: true
        state:
          type: string
          readOnly: true
          description: State/province/region of the business address.
        address:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        staff_size:
          allOf:
          - $ref: '#/components/schemas/StaffSizeEnum'
          readOnly: true
          title: Number of staff
        country:
          type: string
          readOnly: true
          description: ISO 3166-1 alpha-2 country code.
        currency:
          type: string
          readOnly: true
          description: ISO 4217 currency code.
        timezone:
          type: string
          readOnly: true
        domain:
          type: string
          readOnly: true
          nullable: true
          title: Custom Domain
          description: Optional custom domain (e.g. acme.com).
        logo:
          type: string
          format: uri
          readOnly: true
          nullable: true
          description: Logo to display on invoices and receipts.
        plan:
          allOf:
          - $ref: '#/components/schemas/Plan'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - business_types
      - country
      - created_at
      - currency
      - domain
      - email
      - id
      - is_active
      - legal_name
      - logo
      - name
      - phone
      - plan
      - primary_business_type
      - registration_number
      - staff_size
      - state
      - timezone
      - updated_at
    OrganizationBusinessType:
      type: object
      description: A business type as attached to one organization.
      properties:
        id:
          type: string
          readOnly: true
        code:
          type: string
          description: Stable key, e.g. 'wholesale_distribution'.
          readOnly: true
        name:
          type: string
          readOnly: true
        is_primary:
          type: boolean
          readOnly: true
      required:
      - code
      - id
      - is_primary
      - name
    OrganizationBusinessTypesUpdate:
      type: object
      description: |-
        Body of PUT /organizations/{id}/business-types/ (replaces the whole set).
            {"business_types": ["retail", "wholesale_distribution"],
             "primary_business_type": "retail"}
      properties:
        business_types:
          type: array
          items:
            type: string
            description: Stable key, e.g. 'wholesale_distribution'.
        primary_business_type:
          type: string
          description: Stable key, e.g. 'wholesale_distribution'.
      required:
      - business_types
      - primary_business_type
    OrganizationCreate:
      type: object
      description: |-
        Body of POST /organizations/: onboarding screen 1 (business type) and
        screen 2 (business details) submitted together, so no half-created
        organization can exist.

        Branding and templates belong to a later onboarding step.

        Timezone is not collected from the onboarding request. The service layer
        applies the default timezone of Africa/Lagos through OrganizationProfile.
      properties:
        id:
          type: string
          readOnly: true
        business_type:
          type: string
          description: Stable key, e.g. 'wholesale_distribution'.
          writeOnly: true
        name:
