  /api/products/:
    get:
      operationId: products_list
      description: Retrieves a list of all products along with their nested batches,
        discounts, and unit conversions.
      summary: List all Products
      tags:
      - Products
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
    post:
      operationId: products_create
      description: |-
        Creates a product, optionally including opening stock, nested batches, bulk discounts, and unit conversions.

        What happens in one transaction:

        - the `Product` is created;
        - nested records (`ProductBatch`, `ProductBulkDiscount`, `ProductUnitConversion`) are created;
        - if `quantity_in_stock` > 0 and `warehouse_id` is passed, `create_opening_stock` is called to create the initial `Inventory` and `InventoryLedgerEntry`.

        Where the values come from:

        - `category`: GET `/api/products/categories/`
        - `brand`: GET `/api/products/brands/`
        - `warehouse_id`: GET `/api/warehouse/warehouses/` (optional, needed if `quantity_in_stock` > 0).

        `track_inventory` is a boolean. If `True`, inventory ledger is strictly enforced. `quantity_in_stock` is optional. `current_stock` cannot be modified here.
      summary: Create a New Product
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
            examples:
              CompleteProductPayload:
                value:
                  name: Premium Wireless Headphones
                  sku: WH-1000XM5
                  barcode: '4905524933923'
                  organization: 1
                  category: 1
                  brand: 1
                  description: Noise-cancelling over-ear headphones.
                  quality_grade: Grade A
                  unit_of_measurement: pcs
                  product_type: physical
                  tax_config: taxable
                  tax_rate: '15.00'
                  track_inventory: true
                  purchase_cost: '250.00'
                  vendor_sale_cost: '270.00'
                  customer_sale_price: '350.00'
                  minimum_stock_level: 10
                  quantity_in_stock: 50
                  warehouse_id: 1
                  batches:
                  - expiry_date: '2028-12-31'
                    cost_price: '245.00'
                    selling_price: '350.00'
                  bulk_discounts:
                  - min_quantity: 10
                    discount_amount: '20.00'
                  unit_conversions:
                  - unit_name: carton
                    multiplier: '12.000'
                    price_override: '4000.00'
                summary: Complete Product Payload
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductCreate'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreate'
          description: ''
