  /api/organizations/{organization_id}/purchases/:
    get:
      operationId: organizations_purchases_list
      description: |-
        ### Overview
        Retrieves a paginated list of purchase orders for organizations the authenticated user belongs to. Implements strict multi-tenant boundary isolation (PRD §6).

        ### Required Permissions & Access Control (PRD §28, §55)
        - Requires **`VIEW_PURCHASES`** permission in the target tenant organization.
        - Unauthenticated requests return HTTP 401.
        - Authenticated callers without active membership or `VIEW_PURCHASES` capability receive HTTP 403 Forbidden.

        ### Plan Limits & Subscription Invariants (PRD §10, §52)
        - Read operations require active tenant organization standing.
        - Querying purchase orders is read-only and does NOT consume transaction quota allocations (`max_transactions_per_month`).

        ### Business Context (PRD §18)
        A Purchase Order tracks goods ordered from an external vendor. The header summarizes procurement metadata such as vendor, target warehouse, order dates, delivery methods, additional fees (shipping/handling), and vendor invoice references.

        ### Financial Calculations
        - **`ordered_value`**: Total monetary value of items as originally ordered, net of discounts plus other costs.
        - **`total_value`**: Total monetary value of items **physically received so far**, net of prorated discounts plus other costs. Only received value reflects actual supplier liability.

        ### Query Parameters
        - `organization_id`: (UUID in URL path) Target tenant organization.
      summary: List Purchase Orders
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        description: UUID of the tenant organization owning the purchase orders.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Purchases
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPurchaseList'
          description: Paginated list of purchase orders.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseDetailError'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
          description: Authentication credentials were not provided or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseDetailError'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: The caller lacks permission to perform this action (e.g. lacking
            VIEW_PURCHASES, CREATE_PURCHASE, or RECEIVE_GOODS).
    post:
      operationId: organizations_purchases_create
      description: |-
        ### Overview
        Creates a new purchase order and its associated line items in an atomic database transaction.

        ### Required Permissions & Access Control (PRD §28, §55)
        - Requires **`CREATE_PURCHASE`** permission in the target organization.
        - Roles without this permission (e.g. Sales Representative, Inventory Staff) receive HTTP 403 Forbidden.

        ### Plan Limits & Subscription Invariants (PRD §10, §52)
        - **Subscription Standing**: Evaluates `ensure_subscription_active(organization)`. If the subscription is inactive, delinquent, or suspended, creation is rejected with HTTP 402/403 (`SUBSCRIPTION_INACTIVE`).
        - **Location Quota**: The destination `warehouse` must belong to the tenant and be an active location within the organization's `max_locations` plan limit.
        - **Monthly Transactions Quota**: Placing an order in `draft` status does NOT increment monthly transaction counts (`max_transactions_per_month`) because physical inventory has not moved yet. Quotas are enforced when goods arrive via `/receive/`.

        ### Critical Inventory Rule (PRD §16 & §18)
        **Creating a purchase order does NOT alter inventory stock.**
        - The order is initially placed in `draft` status.
        - Inventory quantities and ledger entries are untouched until physical goods are checked in via the `/receive/` endpoint.
        - Prevents phantom stock from appearing in warehouse availability before delivery.

        ### Request Payload Structure & Example
        ```json
        {
          "organization": "a1b2c3d4-e5f6-4789-b1c2-d3e4f5a6b7c8",
          "vendor": "f1e2d3c4-b5a6-4789-b1c2-d3e4f5a6b7c8",
          "warehouse": "c1d2e3f4-a5b6-4789-b1c2-d3e4f5a6b7c8",
          "delivery_method": "Supplier Delivery",
          "other_costs": "5000.00",
          "discount": "1000.00",
          "order_date": "2026-10-09",
          "delivery_date": "2026-10-16",
          "notes": "Restocking core warehouse items for Q4 wholesale distribution.",
          "items": [
            {
              "product": "d1e2f3a4-b5c6-4789-b1c2-d3e4f5a6b7c8",
              "variant": "e2f3a4b5-c6d7-4789-b1c2-d3e4f5a6b7c8",
              "unit": "b3c4d5e6-f7a8-4789-b1c2-d3e4f5a6b7c8",
              "quantity_ordered": 100,
              "purchase_cost": "2500.00",
              "discount": "500.00"
            }
          ]
        }
        ```

        ### Field Roles
        - **`product` (UUID)**: Required. Primary key of catalog Product (from `GET /api/products/products/`). Does NOT need to already exist in warehouse inventory.
        - **`purchase_cost`**: Agreed unit procurement cost, snapshotted at creation.
        - **`quantity_ordered`**: Must be a positive integer (`>= 1`).

        ### Edge Cases & Validation
        - **Active Subscription**: The organization's subscription must be active; suspended or cancelled accounts cannot initiate purchases.
        - **Vendor & Warehouse Tenant Check**: The specified `vendor` and `warehouse` must belong to the specified `organization`.
        - **Line Items**: Quantities must be positive integers (`quantity_ordered >= 1`). Unit purchase costs must be `>= 0.00`.
      summary: Create a Purchase Order
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{32,36}$
        required: true
      tags:
      - Purchases
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseCreate'
            examples:
              StandardPurchaseOrderWithLineItems:
                value:
                  organization: a1b2c3d4-e5f6-4789-b1c2-d3e4f5a6b7c8
                  vendor: f1e2d3c4-b5a6-4789-b1c2-d3e4f5a6b7c8
                  warehouse: c1d2e3f4-a5b6-4789-b1c2-d3e4f5a6b7c8
                  vendor_invoice_number: INV-VEN-2026-9812
                  delivery_method: Supplier Delivery
                  other_costs: '5000.00'
                  discount: '1000.00'
                  order_date: '2026-10-09'
                  delivery_date: '2026-10-16'
                  notes: Restocking core warehouse items for Q4 wholesale distribution.
                  items:
                  - product: d1e2f3a4-b5c6-4789-b1c2-d3e4f5a6b7c8
                    variant: e2f3a4b5-c6d7-4789-b1c2-d3e4f5a6b7c8
                    unit: b3c4d5e6-f7a8-4789-b1c2-d3e4f5a6b7c8
                    quantity_ordered: 100
                    purchase_cost: '2500.00'
                    discount: '500.00'
                  - product: c4d5e6f7-a8b9-4789-b1c2-d3e4f5a6b7c8
                    quantity_ordered: 50
                    purchase_cost: '1200.00'
                summary: Create PO with Product UUIDs and line items
                description: Full purchase order creation payload including header
                  info, vendor, destination warehouse, and line items. Each line item
                  requires the catalog Product UUID (obtained from GET /api/products/products/).
                  Snapshots purchase costs at order time. Does NOT update inventory.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PurchaseCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PurchaseCreate'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
              examples:
                PurchaseOrderResponse:
                  value:
                    id: 7b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                    purchase_number: PO-2026-0004
                    organization: a1b2c3d4-e5f6-4789-b1c2-d3e4f5a6b7c8
                    vendor: f1e2d3c4-b5a6-4789-b1c2-d3e4f5a6b7c8
                    warehouse: c1d2e3f4-a5b6-4789-b1c2-d3e4f5a6b7c8
                    ordered_by: 11111111-2222-3333-4444-555555555555
                    received_by: null
                    vendor_invoice_number: INV-VEN-2026-9812
                    supporting_document: null
                    delivery_date: '2026-10-16'
                    order_date: '2026-10-09'
                    delivery_method: Supplier Delivery
                    other_costs: '5000.00'
                    discount: '1000.00'
                    status: draft
                    notes: Restocking core warehouse items for Q4 wholesale distribution.
                    items:
                    - id: 8c2deb4d-4c8d-5cae-acde-3c1e8c4dcb7e
                      purchase: 7b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                      product: d1e2f3a4-b5c6-4789-b1c2-d3e4f5a6b7c8
                      variant: e2f3a4b5-c6d7-4789-b1c2-d3e4f5a6b7c8
                      unit: b3c4d5e6-f7a8-4789-b1c2-d3e4f5a6b7c8
                      quantity_ordered: 100
                      quantity_received: 0
                      purchase_cost: '2500.00'
                      discount: '500.00'
                      received_value: '0.00'
                      ordered_value: '249500.00'
                      created_at: '2026-10-09T14:00:00Z'
                    total_value: '4000.00'
                    ordered_value: '253500.00'
                    created_at: '2026-10-09T14:00:00Z'
                  summary: Complete PO representation
                  description: Full representation of a purchase order with calculated
                    totals, order status, and item lines.
          description: Purchase order successfully created in draft status.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseCodeDetailError'
              examples:
                ValidationError:
                  value:
                    vendor:
                    - This field is required.
                    items:
                    - This field is required.
                  summary: Validation Error
          description: Validation error (e.g. missing required fields, invalid vendor,
            or negative quantities).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseDetailError'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
          description: Authentication credentials were not provided or are invalid.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseCodeDetailError'
              examples:
                MonthlyTransactionLimitReached:
                  value:
                    code: PLAN_LIMIT_EXCEEDED
                    detail: Plan limit reached for 'max_transactions_per_month'. Upgrade
                      your subscription to continue processing goods receipts.
                  summary: Monthly Transaction Limit Reached
                SubscriptionInactive:
                  value:
                    code: SUBSCRIPTION_INACTIVE
                    detail: Organization subscription is expired or inactive.
                  summary: Subscription Inactive
          description: The organization's subscription is inactive or has exceeded
            plan limits (e.g. max_transactions_per_month).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseDetailError'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: The caller lacks permission to perform this action (e.g. lacking
            VIEW_PURCHASES, CREATE_PURCHASE, or RECEIVE_GOODS).
