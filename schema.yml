          type: string
          description: Organization this product belongs to.
        category:
          type: string
          nullable: true
          description: Category this product is grouped under.
        brand:
          type: string
          nullable: true
          description: Manufacturer/brand of this product, if applicable.
        created_by:
          type: integer
          nullable: true
