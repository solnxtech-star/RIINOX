        low_stock_alert_unit:
          nullable: true
          description: |-
            The unit for the low stock alert (e.g. 'carton'). If not set, defaults to base unit.

            * `pcs` - Piece(s)
            * `kg` - Kilogram
            * `g` - Gram
            * `l` - Litre
            * `ml` - Millilitre
            * `box` - Box
            * `pack` - Pack
            * `carton` - Carton
            * `dozen` - Dozen
            * `m` - Metre
            * `other` - Other
          oneOf:
          - $ref: '#/components/schemas/UnitNameEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        opening_stock:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Stock quantity recorded when the product was first created.
        status:
          allOf:
          - $ref: '#/components/schemas/StatusD6cEnum'
