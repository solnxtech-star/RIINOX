          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          title: Customer Sale Price Override
          description: Override the price charged to customers for this specific variant.
        is_active:
          type: boolean
          description: Whether this variant is active and available.
      required:
      - id
      - name
