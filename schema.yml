openapi: 3.0.3
info:
  title: riinox-backend API
  version: 1.0.0
  description: Documentation of API endpoints of invoive-management-backend
paths:
  /api/auth-token/:
    post:
      operationId: auth_token_create
      tags:
      - auth-token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthToken'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthToken'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
          description: ''
  /api/auth/jwt/login/:
    post:
      operationId: auth_jwt_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /api/auth/jwt/refresh/:
    post:
      operationId: auth_jwt_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/jwt/verify/:
    post:
      operationId: auth_jwt_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
  /api/business-type/:
    get:
      operationId: business_type_list
      description: The catalog of business types, ordered for display. Use `?context=onboarding`
        to get only the cards shown on the onboarding screen; without it you get every
        active type (for the later "edit business types" screen). `code` is the stable
        key the other endpoints use.
      summary: List business types
      parameters:
      - in: query
        name: context
        schema:
          type: string
          enum:
          - onboarding
        description: '`onboarding` returns only the cards shown on the onboarding
          screen.'
      tags:
      - Business Types
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessType'
          description: Business types.
        '401':
          description: Authentication credentials were not provided or are invalid.
  /api/business-type/{code}/:
    get:
      operationId: business_type_retrieve
      description: One business type by its `code` (for example `wholesale_distribution`).
      summary: Retrieve a business type
      parameters:
      - in: path
        name: code
        schema:
          type: string
          description: Stable key, e.g. 'wholesale_distribution'.
        required: true
      tags:
      - Business Types
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessType'
          description: The business type.
        '401':
          description: Authentication credentials were not provided or are invalid.
        '404':
          description: Not found. Also returned when the resource belongs to an organization
            the caller isn't a member of.
  /api/invitations/accept/:
    post:
      operationId: invitations_accept
      description: |-
        Turns the invitation into a membership of the organization. This is the step that consumes the token.

        **Auth:** the caller must be **signed in** (`401` otherwise) and their account's email must be **verified** and **equal to the invited email**.

        **Token:** the raw token from the email link (`/accept-invite?token=...`). It is single-use and only ever exists in the email and the link. The API stores a hash, so it cannot be recovered: if it is lost, the team has to **resend** the invitation, which also kills the old link.

        **Workflow**
        1. Open the link and call **validate** to render the invite screen.
        2. If the user is not signed in, send them to sign up or log in **with the invited email**, then to email verification if needed. Keep the token across these redirects (in memory or `sessionStorage`).
        3. Call this endpoint with the token.
        4. On `200`, route the user into the organization.

        **Body:** `token` (required).

        **Result:** `200` with the accepted membership/organization details. The membership is active immediately and the token can no longer be used.

        **What to do for each error**
        - `401`: not signed in. Send them to login and come back.
        - `403 EMAIL_NOT_VERIFIED`: send them to email verification, then back here.
        - `403 INVITATION_EMAIL_MISMATCH`: signed in as the wrong account. Say which account is active and offer *Log out and switch account*. Never offer to accept anyway.
        - `403 USER_LIMIT_REACHED`: the organization has no free seat. The invitee cannot fix this; ask them to contact an admin.
        - `404 INVITATION_INVALID` / `410 INVITATION_EXPIRED`: same handling as in validate.
        - `409 ALREADY_MEMBER`: not a failure for the user. Route them into the organization with a soft message.
        - `409 MEMBERSHIP_INACTIVE`: they were removed or deactivated earlier. Show that their access was deactivated and to contact an admin. Retrying will not help.
        - `429`: wait for `Retry-After`.

        **Double clicks:** disable the button while the request is in flight. A second call after a successful first one returns `404 INVITATION_INVALID` or `409 ALREADY_MEMBER`, which looks like a failure but is not.

        **Errors:** every error body is `{"code": "...", "detail": "..."}`. Branch on `code`, never on `detail` (the text may change). Field validation errors (`400`) use `{"code": "VALIDATION_ERROR", "detail": ..., "errors": {"<field>": [...]}}`.
      summary: Accept an invitation
      tags:
      - Invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitation'
            examples:
              Accept:
                value:
                  token: <token-from-the-email-link>
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptInvitation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptInvitation'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAccepted'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: NOT_AUTHENTICATED
                    detail: Authentication credentials were not provided.
                  summary: Not authenticated
          description: Not signed in.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                EmailNotVerified:
                  value:
                    code: EMAIL_NOT_VERIFIED
                    detail: Verify your email address first.
                  summary: Email not verified
                WrongAccount:
                  value:
                    code: INVITATION_EMAIL_MISMATCH
                    detail: This invitation was sent to a different email.
                  summary: Wrong account
                NoFreeSeat:
                  value:
                    code: USER_LIMIT_REACHED
                    detail: This organization has reached its user limit.
                  summary: No free seat
          description: The account cannot accept this invitation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid:
                  value:
                    code: INVITATION_INVALID
                    detail: This invitation link is not valid.
          description: Unknown, used or revoked token, or deactivated organization.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AlreadyAMember:
                  value:
                    code: ALREADY_MEMBER
                    detail: You are already a member of this organization.
                  summary: Already a member
                InactiveMembership:
                  value:
                    code: MEMBERSHIP_INACTIVE
                    detail: Your membership is inactive.
                  summary: Inactive membership
          description: The user already has a membership in this organization.
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Expired:
                  value:
                    code: INVITATION_EXPIRED
                    detail: This invitation has expired.
          description: The invitation has expired.
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before trying again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Too many requests. See `Retry-After`.
  /api/invitations/validate/{token}/:
    get:
      operationId: invitations_validate
      description: |-
        **Public: no login needed** (`auth=[]`). Call it as soon as the invite page opens, to show *who invited you, to which organization and in what role* before the invitee signs up or logs in. It changes nothing: the token stays valid.

        **Token:** the raw token from the email link (`/accept-invite?token=...`). It is single-use and only ever exists in the email and the link. The API stores a hash, so it cannot be recovered: if it is lost, the team has to **resend** the invitation, which also kills the old link.

        **What is returned:** only the display fields needed for the screen: the organization name, the role name, the invited email and the expiry. Nothing else about the organization or its members is exposed.

        **How to use the result**
        - Show `invited_email` and ask the user to sign up or log in **with that address**: accept will fail for any other account.
        - Pre-fill the email field on the signup form and make it read-only.
        - Show `expires_at` in the user's local time.

        **Not found vs expired**
        - `404 INVITATION_INVALID`: the token is unknown, already used, revoked, or the organization is deactivated. The API deliberately does not say which, so the message must stay generic. A new invitation is the only recovery.
        - `410 INVITATION_EXPIRED`: the invitation was real but is past `expires_at`. Tell the user to ask for a new one; the team can resend it.

        **Rate limit:** per client. On `429` wait for `Retry-After`; never retry in a loop.

        **Errors:** every error body is `{"code": "...", "detail": "..."}`. Branch on `code`, never on `detail` (the text may change). Field validation errors (`400`) use `{"code": "VALIDATION_ERROR", "detail": ..., "errors": {"<field>": [...]}}`.
      summary: Preview an invitation
      parameters:
      - in: path
        name: token
        schema:
          type: string
          pattern: ^[\w-]+$
        required: true
      - in: query
        name: token
        schema:
          type: string
        description: Invitation token from the email link.
        required: true
      tags:
      - Invitations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
              examples:
                ValidInvitation:
                  value:
                    organization: Okafor & Sons Stores
                    role: Front Desk
                    invited_email: new.hire@techify.com
                    expires_at: '2026-10-15T08:15:00Z'
                  summary: Valid invitation
          description: The invitation is valid and can still be accepted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid:
                  value:
                    code: INVITATION_INVALID
                    detail: This invitation link is not valid.
          description: Unknown, used or revoked token, or deactivated organization.
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Expired:
                  value:
                    code: INVITATION_EXPIRED
                    detail: This invitation has expired.
          description: The invitation has expired.
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before trying again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Too many requests. See `Retry-After`.
  /api/memberships/:
    get:
      operationId: memberships_list
      description: 'Memberships the caller can see: **their own**, plus **every membership
        of the organizations they manage** (Owner or Administrator). Regular members
        therefore see only themselves. Filter with `?organization=`.'
      summary: List memberships
      parameters:
      - in: query
        name: organization
        schema:
          type: string
        description: Only memberships of this organization.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Memberships
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMembershipList'
          description: Visible memberships.
        '400':
          description: Malformed `organization` filter.
        '401':
          description: Authentication credentials were not provided or are invalid.
  /api/memberships/{id}/:
    get:
      operationId: memberships_retrieve
      description: 'One membership: user, organization, role, active/accepted status
        and (for pending invitations) the expiry. Only visible if it is the caller''s
        own or belongs to an organization they manage.'
      summary: Retrieve a membership
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A UUID string identifying this Membership.
        required: true
      tags:
      - Memberships
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: The membership.
        '401':
          description: Authentication credentials were not provided or are invalid.
        '404':
          description: Not found. Also returned when the resource belongs to an organization
            the caller isn't a member of.
    put:
      operationId: memberships_update
      description: |-
        Changes a member's **role** and/or **active** flag. **Administrators and Owners** only.

        Rules: the Owner's membership can't be changed; only the Owner can change an Administrator or grant the Administrator role; the Owner role is never assignable; nobody can change their own membership; a role must belong to the membership's organization.
      summary: Update a membership
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A UUID string identifying this Membership.
        required: true
      tags:
      - Memberships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MembershipUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MembershipUpdate'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: The updated membership.
        '400':
          description: A membership rule was violated.
        '401':
          description: Authentication credentials were not provided or are invalid.
        '403':
          description: The caller is a member but not an Administrator or Owner of
            this organization.
        '404':
          description: Not found. Also returned when the resource belongs to an organization
            the caller isn't a member of.
    patch:
      operationId: memberships_partial_update
      description: |-
        Changes a member's **role** and/or **active** flag. **Administrators and Owners** only.

        Rules: the Owner's membership can't be changed; only the Owner can change an Administrator or grant the Administrator role; the Owner role is never assignable; nobody can change their own membership; a role must belong to the membership's organization.
      summary: Partially update a membership
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A UUID string identifying this Membership.
        required: true
      tags:
      - Memberships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMembershipUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMembershipUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMembershipUpdate'
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: The updated membership.
        '400':
          description: A membership rule was violated.
        '401':
          description: Authentication credentials were not provided or are invalid.
        '403':
          description: The caller is a member but not an Administrator or Owner of
            this organization.
        '404':
          description: Not found. Also returned when the resource belongs to an organization
            the caller isn't a member of.
    delete:
      operationId: memberships_destroy
      description: '**Administrators and Owners** only. A pending invitation is **deleted**;
        an accepted member is **deactivated, not deleted**, so history and audit references
        stay intact, and they immediately lose access to the organization. The same
        protections as updating apply (Owner, own membership, Administrators). There
        is no self-service leave endpoint yet.'
      summary: Remove a member or revoke an invitation
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A UUID string identifying this Membership.
        required: true
      tags:
      - Memberships
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: Removed.
        '400':
          description: A membership rule was violated.
        '401':
          description: Authentication credentials were not provided or are invalid.
        '403':
          description: The caller is a member but not an Administrator or Owner of
            this organization.
        '404':
          description: Not found. Also returned when the resource belongs to an organization
            the caller isn't a member of.
  /api/memberships/invite/:
    post:
      operationId: memberships_invite_create
      description: |-
        Emails an invitation to join an organization. Only **Administrators and Owners of that organization** can invite; the organization must be one the caller belongs to.

        Rules:
        - the role must belong to the organization; the **Owner** role can never be granted by invitation, and only the **Owner** can invite an **Administrator**;
        - someone who is already a member, or already has an unexpired invitation, can't be invited again;
        - an **expired** invitation to the same email is refreshed (new token and expiry) instead of duplicated;
        - pending invitations count against the plan's **user limit**.

        The email is sent only after the invitation is saved.
      summary: Invite a member by email
      tags:
      - Invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
            examples:
              InviteAFront-deskUser:
                value:
                  organization: 1
                  role: 7
                  invited_email: new.hire@techify.com
                summary: Invite a front-desk user
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationSent'
          description: Invitation created and emailed.
        '400':
          description: Unknown organization or role, already a member, already invited,
            or a role rule was broken.
        '401':
          description: Authentication credentials were not provided or are invalid.
        '403':
          description: Not an Administrator/Owner of the organization, or the plan's
            user limit is reached.
  /api/meta-data/countries/:
    get:
      operationId: meta_data_countries_retrieve
      description: Every ISO 3166-1 country, sorted by name. `code` is the two-letter
        alpha-2 code the other endpoints accept (for example `country` when creating
        an organization). Static data, safe to cache.
      summary: List countries
      tags:
      - Metadata
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          headers:
            Cache-Control:
              schema:
                type: string
              description: Browsers may cache this response (`private, max-age=86400`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Option'
              examples:
                Countries:
                  value:
                  - - code: GH
                      name: Ghana
                    - code: NG
                      name: Nigeria
          description: Countries.
        '401':
          description: Authentication credentials were not provided or are invalid.
  /api/meta-data/currencies/:
    get:
      operationId: meta_data_currencies_retrieve
      description: ISO 4217 currencies, sorted by name, feeding the **Base currency**
        dropdown. Precious metals, testing codes and supranational units (`XAU`, `XTS`,
        `XXX`...) are excluded. Static data, safe to cache.
      summary: List currencies
      tags:
      - Metadata
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          headers:
            Cache-Control:
              schema:
                type: string
              description: Browsers may cache this response (`private, max-age=86400`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Option'
              examples:
                Currencies:
                  value:
                  - - code: GHS
                      name: Ghana Cedi
                    - code: NGN
                      name: Naira
          description: Currencies.
        '401':
          description: Authentication credentials were not provided or are invalid.
  /api/meta-data/states/:
    get:
      operationId: meta_data_states_retrieve
      description: |-
        The states, provinces or regions of one country, feeding the **City/Region** dropdown. Reload it whenever the selected country changes.

        A valid country whose states haven't been added yet returns an **empty list**, not an error. In that case show a free-text field: the API accepts any state text for such countries.
      summary: List states or regions of a country
      parameters:
      - in: query
        name: country
        schema:
          type: string
          maxLength: 2
          minLength: 2
        required: true
      tags:
      - Metadata
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          headers:
            Cache-Control:
              schema:
                type: string
              description: Browsers may cache this response (`private, max-age=3600`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StateOption'
              examples:
                Nigeria:
                  value:
                  - - name: Abia
                      code: NG-AB
                    - name: Adamawa
                      code: NG-AD
          description: States of the country (possibly empty).
        '400':
          description: Missing or unknown country code.
        '401':
          description: Authentication credentials were not provided or are invalid.
  /api/organizations/:
    get:
      operationId: organizations_list
      description: 'Organizations the authenticated user is an **accepted, active
        member** of. Deactivated organizations and memberships are excluded. Each
        entry includes the plan and the organization''s business types (primary first).
        Members are not embedded: use `GET /organizations/{id}/members/`.'
      summary: List my organizations
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Organizations
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationList'
          description: Organizations the user belongs to.
        '401':
          description: Authentication credentials were not provided or are invalid.
    post:
      operationId: organizations_create
      description: |-
        Creates a tenant from the two onboarding screens: the chosen **business type** and the **business details**, submitted together so no half-created organization can exist.

        What happens in one transaction:
        - the caller becomes the organization's **Owner**;
        - the chosen type becomes the **primary business type** (add more later with `PUT /organizations/{id}/business-types/`);
        - the built-in roles, the **Free plan** subscription, document numbering sequences and the shared default invoice/receipt templates are set up.

        Where the values come from:
        - `business_type`: `GET /business-types/?context=onboarding`.
        - `country`, `currency`: `GET /metadata/countries/` and `GET /metadata/currencies/` (ISO codes). **Both are fixed after creation**, so the currency must be right the first time.
        - `state`: `GET /metadata/states/?country=<code>`. It must match one of the listed states; if that list is empty for the chosen country, any text is accepted.

        `phone` is optional and normalised to international format using the organization's country (`0803 123 4567` becomes `+2348031234567` for `NG`). Branding and templates are configured later with `PATCH /organizations/{id}/`.
      summary: Create an organization (onboarding)
      tags:
      - Organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
            examples:
              RetailShopInNigeria:
                value:
                  business_type: retail
                  name: Okafor & Sons Stores
                  registration_number: RC1234567
                  country: NG
                  state: Rivers
                  address: 12 Aba Road, Port Harcourt
                  postal_code: '500001'
                  tax_id: '2345678901'
                  currency: NGN
                  staff_size: 6-10
                summary: Retail shop in Nigeria
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: Organization created; the caller is its Owner.
        '400':
          description: Validation error. Field-level checks run first; the state and
            phone checks run only once those pass, so they are reported in a later
            response.
        '401':
          description: Authentication credentials were not provided or are invalid.
