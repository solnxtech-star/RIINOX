        ### Overview
        Updates specific attributes of a purchase order without supplying the entire payload.

        ### Required Permissions & Access Control (PRD §28, §55)
        - Requires **`CREATE_PURCHASE`** permission in the organization.

        ### Plan Limits & Subscription Invariants (PRD §10, §52)
        - Evaluates `ensure_subscription_active(organization)`.

        ### Common Use Cases
        - **Revising Products / Line Items**: Send an `items` array with updated `product` UUIDs, quantities, and costs (only when `quantity_received == 0`).
        - **Attaching Vendor Invoices**: Send `vendor_invoice_number` after invoice receipt.
        - **Uploading Documents**: Attach `supporting_document` (waybill, delivery note, or scanned invoice).
        - **Updating Logistics**: Update `notes`, `delivery_method`, or estimated `delivery_date`.

        ### Product Revision Example (PATCH)
        ```json
        {
          "items": [
            {
              "product": "d1e2f3a4-b5c6-4789-b1c2-d3e4f5a6b7c8",
              "quantity_ordered": 150,
              "purchase_cost": "2400.00",
              "discount": "200.00"
            }
          ]
        }
        ```

        ### Constraints
        - If `items` is included in the payload, the order must not have any received goods (`quantity_received == 0`).
